<style>
/* Layout: sticky header with nav + balance + profile; pages are stacked panels on a deep violet night; bottom tab bar on phones */
:root{
  --bg:#08091a; --bg-2:#0d0f25; --surf:#12142e; --surf-2:#1a1c40; --line:#25285a;
  --fg:#f2f1ff; --mute:#9799c9; --acc:#7a3cff; --acc-2:#a94dff; --acc-ink:#fff; --coin:#ffc53a;
  --good:#3ee08c; --bad:#ff4d63;
  --r-c:#b0c3d9; --r-i:#5e98d9; --r-b:#4b69ff; --r-p:#8847ff; --r-k:#d32ce6; --r-r:#eb4b4b; --r-g:#e4ae39;
  --f-logo:'Lobster',cursive;
  --f-disp:'Rubik','Arial Black',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(1000px 600px at 70% -10%,rgba(122,60,255,.22),transparent 60%),radial-gradient(800px 500px at 0% 30%,rgba(60,40,160,.16),transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--acc-2);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mute{color:var(--mute)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;font-weight:800}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);font-weight:700}
.pos{color:var(--good)}.neg{color:var(--bad)}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:rgba(8,9,26,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:10px;height:66px}
.logo{display:flex;flex-direction:column;align-items:flex-start;line-height:.82;text-decoration:none;color:var(--fg);transform:rotate(-6deg);flex:0 0 auto;cursor:pointer}
.logo .l1{font-family:var(--f-logo);font-size:28px;text-shadow:0 0 18px rgba(169,77,255,.6),2px 2px 0 var(--acc)}
.logo .l2{font-family:var(--f-disp);font-style:italic;font-weight:900;font-size:17px;letter-spacing:.04em;margin-left:18px;background:linear-gradient(90deg,var(--acc-2),#5b8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-top{display:none;gap:4px;margin-left:24px}
.nav-top button{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mute)}
.nav-top button:hover{color:var(--fg)}
.nav-top button[aria-current="true"]{color:var(--fg);background:var(--surf-2);box-shadow:inset 0 0 0 1px var(--line)}
.nav-top button[aria-current="true"] svg{stroke:var(--acc-2)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px;position:relative}
.online{display:none;align-items:center;gap:6px;font-family:var(--f-mono);font-weight:700;color:var(--good);font-size:13px}
.online svg{width:18px;height:18px;fill:var(--good)}
@media (min-width:1100px){.online{display:flex}}
.balchip{display:flex;align-items:center;gap:8px;height:44px;padding:0 5px 0 10px;border-radius:12px;background:var(--surf);border:1px solid var(--line);transition:border-color .3s}
.balchip.up{border-color:var(--good)}.balchip.down{border-color:var(--bad)}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a3,var(--coin) 45%,#c27c00);box-shadow:inset 0 0 0 2px rgba(0,0,0,.15);display:grid;place-items:center;font:900 11px var(--f-disp);color:#7a4a00;flex:0 0 auto}
.bl{display:flex;flex-direction:column;line-height:1.1}
.bl small{font-size:10px;color:var(--mute);font-weight:700}
.bl b{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.plus{width:32px;height:32px;border-radius:9px;background:linear-gradient(180deg,var(--acc-2),var(--acc));color:#fff;font-size:20px;line-height:1;display:grid;place-items:center;box-shadow:0 4px 14px -4px var(--acc)}
.icbtn{width:44px;height:44px;border-radius:12px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.icbtn svg{width:19px;height:19px;fill:none;stroke:var(--fg);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icbtn:active svg{transform:rotate(180deg);transition:transform .3s}
@media (max-width:380px){.icbtn{width:38px}.balchip{padding-left:7px}}
.userchip{display:flex;align-items:center;gap:8px;height:44px;padding:0 8px 0 4px;border-radius:12px;background:var(--surf);border:1px solid var(--line)}
.userchip b{font-size:13px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userchip svg.chev{width:14px;height:14px;stroke:var(--mute);fill:none;stroke-width:2.4}
.ava{width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:14px;color:#0a0b1c;background:var(--c,var(--acc-2));flex:0 0 auto}
.ava.sm{width:24px;height:24px;font-size:11px;border-radius:50%}
.umenu{position:absolute;right:0;top:54px;min-width:220px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;z-index:40;animation:fade .15s}
.umenu button{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:9px;font-weight:700;font-size:14px;text-align:left}
.umenu button:hover{background:var(--surf-2)}
.umenu small{color:var(--mute);font-weight:600}
@media (max-width:640px){.userchip b,.userchip svg.chev{display:none}.userchip{padding:0 4px}.bl small{display:none}.logo .l1{font-size:24px}.logo .l2{font-size:14px}}
@media (min-width:960px){.nav-top{display:flex}}

/* ---------- layout ---------- */
main.wrap{padding-block:22px 110px}
section{display:flex;flex-direction:column;gap:22px}
.nav-bot{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:rgba(10,11,30,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-bot button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;border-radius:10px;font-size:10.5px;font-weight:700;color:var(--mute)}
.nav-bot button[aria-current="true"]{color:var(--fg)}
.nav-bot button[aria-current="true"] svg{stroke:var(--acc-2);filter:drop-shadow(0 0 6px var(--acc))}
.nav-bot svg,.nav-top svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.nav-bot svg{width:22px;height:22px}
@media (min-width:960px){.nav-bot{display:none}main.wrap{padding-bottom:40px}}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.lnk{color:var(--acc-2);font-weight:700;font-size:14px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:12px;font-weight:800;font-size:15px;transition:transform .12s,filter .2s,opacity .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.acc{background:linear-gradient(180deg,var(--acc-2),var(--acc));color:#fff;box-shadow:0 8px 26px -8px var(--acc),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.acc:hover{filter:brightness(1.12);box-shadow:0 10px 32px -6px var(--acc-2),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.ghost{background:var(--surf-2);border:1px solid var(--line)}
.btn.line{background:transparent;border:1px solid var(--line)}
.btn.line:hover{border-color:var(--acc-2)}
.btn.green{background:linear-gradient(180deg,#5af0a4,#22b86a);color:#03200f}
.btn.red{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{height:36px;font-size:13px;padding:0 14px;border-radius:10px}
.btn.lg{height:56px;font-size:16px;padding:0 26px;border-radius:14px}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:8px;font-weight:800;font-size:13px;color:var(--mute);min-width:40px}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--acc-2),var(--acc));color:#fff}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--mute);cursor:pointer;user-select:none}
.chk input{appearance:none;width:38px;height:22px;border-radius:20px;background:var(--surf-2);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .2s;flex:0 0 auto}
.chk input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:transform .2s,background .2s}
.chk input:checked{background:color-mix(in srgb,var(--acc) 45%,var(--surf-2))}
.chk input:checked::after{transform:translateX(16px);background:#fff}
input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:var(--surf-2)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--surf-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--acc-2);margin-top:-8px;box-shadow:0 0 0 4px rgba(169,77,255,.25)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--acc-2)}

/* ---------- 3D crate ---------- */
.crate{--w:118px;--h:52px;--d:72px;position:relative;width:100%;height:calc(var(--h)*2.7);perspective:900px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.crate.sm{--w:74px;--h:34px;--d:46px;height:calc(var(--h)*2.5)}
.crate.lg{--w:230px;--h:100px;--d:140px;height:calc(var(--h)*3)}
@media (max-width:640px){.crate.lg{--w:170px;--h:74px;--d:104px}.crate{--w:104px;--h:46px;--d:64px}}
.crate::before{content:"";position:absolute;left:8%;right:8%;bottom:4%;height:34%;background:radial-gradient(closest-side,var(--c1),transparent);opacity:.6;filter:blur(10px)}
.cb{position:relative;width:0;height:0;transform-style:preserve-3d;transform:translateY(calc(var(--h)*.42)) rotateX(-24deg) rotateY(-30deg);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.case-tile:hover .cb{transform:translateY(calc(var(--h)*.42)) rotateX(-26deg) rotateY(-12deg)}
.f{position:absolute;display:block}
.fr,.bk{width:var(--w);height:var(--h);left:calc(var(--w)/-2);top:calc(var(--h)/-2)}
.lf,.rt{width:var(--d);height:var(--h);left:calc(var(--d)/-2);top:calc(var(--h)/-2)}
.bt,.in{width:var(--w);height:var(--d);left:calc(var(--w)/-2);top:calc(var(--d)/-2)}
.fr{transform:translateZ(calc(var(--d)/2));display:flex;align-items:center;justify-content:center;gap:6%;border-radius:4px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 2px,transparent 2px 16px),linear-gradient(180deg,color-mix(in srgb,var(--c1) 38%,#1a1b33),color-mix(in srgb,var(--c2) 70%,#05050f));
  border:2px solid color-mix(in srgb,var(--c1) 75%,#fff);box-shadow:inset 0 0 16px rgba(0,0,0,.55),inset 0 -12px 18px rgba(0,0,0,.35),0 0 24px -4px var(--c1)}
.fr svg{width:22%;height:auto;fill:none;stroke:var(--c1);stroke-width:1.6;filter:drop-shadow(0 0 4px var(--c1))}
.fr b{font-family:var(--f-logo);font-weight:400;font-size:calc(var(--h)*.36);color:#fff;text-shadow:0 0 8px var(--c1),1px 1px 0 var(--c2)}
.crate.sm .fr b{display:none}.crate.sm .fr svg{width:34%}
.fr::before,.fr::after{content:"";position:absolute;top:18%;width:7%;height:46%;border-radius:2px;background:linear-gradient(#cfd2e6,#6b6f8a);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.fr::before{left:7%}.fr::after{right:7%}
.bk{transform:rotateY(180deg) translateZ(calc(var(--d)/2));background:linear-gradient(#141530,#07071a)}
.lf{transform:rotateY(-90deg) translateZ(calc(var(--w)/2));background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px),linear-gradient(180deg,color-mix(in srgb,var(--c1) 22%,#121330),color-mix(in srgb,var(--c2) 60%,#03030a));border:2px solid color-mix(in srgb,var(--c1) 55%,#000);border-radius:4px}
.rt{transform:rotateY(90deg) translateZ(calc(var(--w)/2));background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 30%,#191a3a),color-mix(in srgb,var(--c2) 60%,#03030a));border:2px solid color-mix(in srgb,var(--c1) 65%,#000);border-radius:4px}
.bt{transform:rotateX(-90deg) translateZ(calc(var(--h)/2));background:#05050f;box-shadow:0 0 40px var(--c1)}
.in{transform:rotateX(90deg) translateZ(calc(var(--h)/2 - 4px));background:radial-gradient(closest-side,color-mix(in srgb,var(--c1) 80%,#fff),var(--c1) 30%,#06061a 90%)}
.lid{width:var(--w);height:var(--d);left:calc(var(--w)/-2);top:0;transform-origin:50% 0;transform-style:preserve-3d;transform:translate3d(0,calc(var(--h)/-2),calc(var(--d)/-2)) rotateX(90deg);transition:transform .8s cubic-bezier(.3,1.35,.45,1)}
.crate.open .lid{transform:translate3d(0,calc(var(--h)/-2),calc(var(--d)/-2)) rotateX(198deg)}
.lid i{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px}
.lid .lt{background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 14px),linear-gradient(180deg,color-mix(in srgb,var(--c1) 50%,#22234a),color-mix(in srgb,var(--c2) 70%,#05050f));border:2px solid color-mix(in srgb,var(--c1) 75%,#fff)}
.lid .lu{transform:rotateY(180deg);background:radial-gradient(70% 70% at 50% 50%,color-mix(in srgb,var(--c1) 45%,transparent),transparent 70%),#0a0a22;border:2px solid color-mix(in srgb,var(--c1) 70%,#000);display:grid;place-items:center}
.lid .lu svg{width:42%;fill:none;stroke:var(--c1);stroke-width:1.4;filter:drop-shadow(0 0 6px var(--c1));transform:scaleY(-1)}
.loot{position:absolute;left:6%;right:6%;top:4%;transform:rotate(-14deg);animation:float 3.4s ease-in-out infinite;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--c1) 70%,transparent))}
.crate.lg .loot{left:4%;right:4%;top:0}
.loot svg{width:100%;height:auto;display:block}
@keyframes float{50%{transform:rotate(-11deg) translateY(-7px)}}
.crate.shake .cb{animation:shake .5s ease-in-out 2}
@keyframes shake{25%{transform:translateY(calc(var(--h)*.42)) rotateX(-24deg) rotateY(-36deg) translateX(-3px)}75%{transform:translateY(calc(var(--h)*.42)) rotateX(-24deg) rotateY(-24deg) translateX(3px)}}

/* ---------- item card (3D skin) ---------- */
.r-c{--rc:var(--r-c)}.r-i{--rc:var(--r-i)}.r-b{--rc:var(--r-b)}.r-p{--rc:var(--r-p)}.r-k{--rc:var(--r-k)}.r-r{--rc:var(--r-r)}.r-g{--rc:var(--r-g)}
.item{position:relative;display:flex;flex-direction:column;min-width:0;overflow:hidden;text-align:left;border-radius:10px;
  background:radial-gradient(120% 80% at 50% 110%,color-mix(in srgb,var(--rc) 34%,transparent),transparent 62%),linear-gradient(180deg,#171936,#0f1029);border:1px solid var(--line);border-bottom:2px solid var(--rc)}
.item::after{content:"";position:absolute;left:12%;right:12%;bottom:-2px;height:3px;background:var(--rc);box-shadow:0 0 14px 2px var(--rc);border-radius:3px}
.item-ic{position:relative;aspect-ratio:140/70;padding:8px 8px 0;perspective:500px}
.item-ic svg{width:100%;height:100%;display:block;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
button.item:hover .item-ic svg,.item.win .item-ic svg{transform:rotateY(-14deg) rotateX(6deg) scale(1.08)}
.item-p{position:absolute;left:0;bottom:0;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--fg);background:rgba(20,21,48,.92);padding:3px 8px;border-radius:0 6px 0 0;font-variant-numeric:tabular-nums}
.item-t{padding:7px 10px 10px;display:flex;flex-direction:column;line-height:1.25;min-width:0}
.item-w{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-s{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-f{font-family:var(--f-mono);font-size:10px;color:var(--mute)}
.tag{position:absolute;top:6px;z-index:2;font:700 9px/1 var(--f-mono);letter-spacing:.03em;padding:3px 5px;border-radius:4px;background:rgba(0,0,0,.45)}
.tag.wr{right:6px;color:var(--mute)}.tag.ch{left:6px;color:var(--fg)}
.st{color:#ff9a4d!important}
.item.win{box-shadow:0 0 0 2px var(--rc),0 0 30px -2px var(--rc);animation:pop .5s ease-out}
@keyframes pop{40%{transform:scale(1.07)}}
.item.sel{box-shadow:0 0 0 2px var(--acc-2),0 0 20px -4px var(--acc-2)}
.item.sel::before{content:"✓";position:absolute;top:6px;left:6px;z-index:3;width:20px;height:20px;border-radius:50%;background:var(--acc-2);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.item.sold{opacity:.35;filter:grayscale(.8)}
.item.mini .item-t{padding:4px 7px 7px}
.item.mini .item-w{font-size:10px}
.item.mini .item-s{font-size:11px}
.item.mini .item-p{font-size:10px;padding:2px 6px}
.item.mini .tag{font-size:8px}
button.item{cursor:pointer;transition:transform .15s}
button.item:hover{transform:translateY(-3px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:12px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
@media (max-width:440px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.sm{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---------- home ---------- */

  background:radial-gradient(110% 70% at 50% 120%,color-mix(in srgb,var(--rc) 40%,transparent),transparent 65%),linear-gradient(180deg,#171936,#0f1029);border:1px solid var(--line);animation:win-in .5s ease-out}

.cta{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:26px 30px;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(400px 200px at 80% 50%,rgba(122,60,255,.35),transparent 70%),repeating-linear-gradient(115deg,rgba(255,255,255,.02) 0 2px,transparent 2px 22px),linear-gradient(90deg,#120f30,#0b0b20)}

.back{align-self:flex-start;font-weight:700;color:var(--mute);padding:6px 0}

.modal{position:fixed;inset:0;z-index:50;background:rgba(4,4,14,.76);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));animation:fade .2s}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

.flip{width:180px;height:230px;margin:10px auto;perspective:800px}
.flip>div{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:flip 2.4s cubic-bezier(.3,.6,.2,1) forwards}
.flip i{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;border:2px solid var(--acc-2);background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 6px,transparent 6px 14px),linear-gradient(160deg,#2a1a6a,#0d0e26);box-shadow:0 0 40px -6px var(--acc-2)}
.flip i b{font-family:var(--f-logo);font-size:34px;font-weight:400;text-shadow:0 0 12px var(--acc-2)}
@keyframes flip{to{transform:rotateY(1080deg)}}

/* ---------- battle ---------- */
.pick-cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;max-height:320px;overflow:auto;padding:2px}
@media (max-width:440px){.pick-cases{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);font-size:11px;font-weight:700;text-align:center;min-width:0}
.pc:hover{border-color:var(--acc-2)}
.pc span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rounds{display:flex;gap:6px;flex-wrap:wrap;min-height:34px;align-items:center}
.rd{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:9px;background:var(--surf-2);border:1px solid var(--line);font-size:12px;font-weight:700}
.rd button{width:22px;height:22px;border-radius:6px;background:var(--bg-2)}
.rd.on{border-color:var(--acc-2);color:#fff;box-shadow:0 0 12px -2px var(--acc-2)}
.rd.done{opacity:.45}
.bt-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pot{font-family:var(--f-mono);font-weight:700;font-size:15px}
.pot b{color:var(--coin)}
.arena{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.ph{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;background:var(--surf);border:1px solid var(--line);min-width:0;transition:border-color .3s,box-shadow .3s}
.ph div{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.ph b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph small{font-family:var(--f-mono);font-size:11px;color:var(--coin);font-weight:700;font-variant-numeric:tabular-nums}
.ph.lead{border-color:var(--acc-2);box-shadow:0 0 18px -6px var(--acc-2)}
.ph.me{background:color-mix(in srgb,var(--acc) 14%,var(--surf))}
.vreel{position:relative;height:260px;overflow:hidden;border-radius:12px;background:linear-gradient(180deg,#0e0f27,#0a0b1f);border:1px solid var(--line);-webkit-mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent)}
.vreel .track{display:flex;flex-direction:column;gap:6px;padding:0 6px;will-change:transform}
.vreel .item{flex:0 0 auto;height:118px}
.vmark{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--acc-2);box-shadow:0 0 12px var(--acc-2);z-index:3}
.vreel .idle{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:12px;text-align:center;padding:8px}
.drops{display:flex;flex-direction:column;gap:6px}
@media (max-width:520px){.arena{gap:5px}.ph{padding:6px;gap:6px}.ph .ava{width:24px;height:24px;font-size:11px}.vreel{height:230px}.vreel .item{height:104px}.vreel .track{padding:0 4px}}
.bt-res{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(8,9,26,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:14px;animation:fade .3s}
.bt-res>div{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:20px;max-width:440px}
.bt-res h2{font-size:clamp(26px,6vw,40px);font-weight:900;text-transform:uppercase}
.bt-res h2.win{color:var(--coin)}.bt-res h2.lose{color:var(--bad)}
.blist{display:flex;flex-direction:column;gap:8px}
.bcard{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line)}
.bcard .who{display:flex;align-items:center;gap:8px;font-weight:800;min-width:0}
.bcard .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.chip{padding:3px 8px;border-radius:6px;background:var(--surf-2);font-weight:700;font-size:12px}
.peers{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.peer{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);font-size:12px;font-weight:700}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.seat{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;background:var(--bg-2);border:1px dashed var(--line);font-weight:700;min-width:0}
.seat.on{border-style:solid}
.seat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{padding:14px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);font-size:14px;color:var(--mute)}
.note b{color:var(--fg)}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));background:radial-gradient(500px 400px at 50% 30%,rgba(122,60,255,.3),transparent 70%),var(--bg)}
.gate-card{max-width:420px;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.gate-card .logo{transform:rotate(-6deg) scale(1.5);margin-bottom:14px}
.gate-card h2{font-size:24px;font-weight:900}
.gate-card p{margin:0;color:var(--mute);font-size:15px}
.gate-card ol{margin:0;padding:14px 14px 14px 34px;text-align:left;border-radius:14px;background:var(--surf);border:1px solid var(--line);font-size:14px;display:flex;flex-direction:column;gap:6px;width:100%}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--surf-2);border-top-color:var(--acc-2);animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.acct{font-size:11.5px;color:var(--good);font-weight:700}

/* ---------- admin ---------- */
.adm-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.adm-top{grid-template-columns:repeat(2,minmax(0,1fr))}}
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.dev{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;padding:14px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line);min-width:0;position:relative}
.dev.me{border-color:var(--acc)}
.dev .dico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--surf-2);position:relative}
.dev .dico svg{width:26px;height:26px;fill:none;stroke:var(--acc-2);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dev .dico i{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--bg-2),0 0 8px var(--good)}
.dev .who{display:flex;flex-direction:column;min-width:0;gap:2px}
.dev .who b{display:flex;align-items:center;gap:6px;font-size:15px;min-width:0}
.dev .who b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev .who small{color:var(--mute);font-size:12.5px}
.dev dl{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:12.5px}
.dev dt{color:var(--mute)}.dev dd{margin:0;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htable{overflow-x:auto}
.htable table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.htable th{text-align:left;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:8px 10px;border-bottom:1px solid var(--line)}
.htable td{padding:10px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);vertical-align:top}
.htable td .mono{font-size:12px}
.dchips{display:flex;flex-direction:column;gap:3px}
.dchips span{color:var(--mute)}.dchips b{color:var(--fg);font-weight:700}

/* ---------- inventory / wallet ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:14px;border-radius:14px;background:var(--surf);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inv-bar .seg{margin-left:auto}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}.case-tile:hover,button.item:hover{transform:none}}

body{margin:0;min-height:100vh;min-height:100dvh}
.toast{z-index:95}
.gate-card .inp{text-align:center}
.gate-card .row{justify-content:center}


/* ================= v2: real skin images & mockup layout ================= */
.skimg{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.55));user-select:none;-webkit-user-select:none;-webkit-user-drag:none;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.skfb{display:block;width:100%;height:100%}.skfb svg{width:100%;height:100%;display:block}

/* item card */
.item{border-radius:12px;background:radial-gradient(85% 65% at 50% 40%,color-mix(in srgb,var(--rc) 32%,transparent),transparent 72%),linear-gradient(180deg,#16173c,#0d0e25);border:1px solid color-mix(in srgb,var(--rc) 26%,var(--line));border-bottom:2px solid var(--rc)}
.item::after{left:18%;right:18%}
.item-ic{aspect-ratio:4/3;padding:12px 10px 2px;perspective:none}
button.item:hover .item-ic .skimg,.item.win .item-ic .skimg{transform:scale(1.08) rotate(-4deg)}
.item-t{padding:2px 10px 10px;gap:1px}
.item-w{font-size:11px}
.item-s{font-size:13px}
.item-p{position:static;background:none;padding:0;margin-top:4px;font-size:13px;border-radius:0;color:var(--fg)}
.tag.wr{left:7px;right:auto;color:#c7c8ef}
.tag.ch{left:auto;right:7px}
.tag.stt{right:7px;left:auto;color:#ff9a4d;background:rgba(255,120,40,.16)}
.item.mini .item-ic{padding:8px 6px 0}
.item.mini .item-p{font-size:11px;margin-top:2px}
.item.mini .item-t{padding:2px 7px 7px}
.item.big{border-width:1px 1px 3px}
.item.big .item-ic{padding:16px 16px 4px}
.item.big .item-s{font-size:16px}
.item.big .item-p{font-size:16px}

/* reels */
.roul{padding:18px 0;background:radial-gradient(60% 120% at 50% 50%,rgba(122,60,255,.14),transparent 70%),linear-gradient(180deg,#0e0f27,#0a0b1f)}
.roul .item{flex:0 0 156px}
.roul.compact .item{flex-basis:116px}
.vreel .item .item-ic{aspect-ratio:auto;height:66px;padding:8px 8px 0}
.vreel .item .item-w{display:none}
.vreel .item .item-t{padding:0 7px 6px}
@media (max-width:520px){.vreel .item .item-ic{height:56px}}

/* real case images */
.caseimg{position:relative;width:100%;height:150px;display:grid;place-items:center;pointer-events:none}
.caseimg::before{content:"";position:absolute;left:14%;right:14%;bottom:4%;height:42%;background:radial-gradient(closest-side,var(--c1),transparent);opacity:.6;filter:blur(14px)}
.caseimg img{position:relative;max-width:94%;max-height:100%;object-fit:contain;filter:drop-shadow(0 12px 18px rgba(0,0,0,.6));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.caseimg.noimg img{visibility:hidden}
.caseimg.sm{height:96px}
.caseimg.lg{height:250px}
.hero-art .caseimg{height:300px}
@media (max-width:640px){.caseimg{height:120px}.caseimg.lg{height:190px}}
.case-tile:hover .caseimg img{transform:translateY(-5px) rotate(-3deg) scale(1.05)}
.caseimg.shake img{animation:cshake .5s ease-in-out 2}
@keyframes cshake{25%{transform:rotate(-5deg) translateX(-5px)}75%{transform:rotate(5deg) translateX(5px)}}
.loot .skimg{height:auto;aspect-ratio:4/3;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--c1) 80%,transparent)) drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.loot{left:2%;right:2%;top:-6%}
.crate.lg .loot{left:0;right:0;top:-12%}
.wc-ic{aspect-ratio:4/3}
.wc-ic .skimg{filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.k-slot .skimg{width:92%;height:92%}
.slot-empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:13px;opacity:.75;border:1px dashed var(--line);border-radius:12px;padding:20px 10px;min-height:150px}
.pc .caseimg{height:64px}

/* avatars with agent pictures */
.ava.img{overflow:hidden;padding:0;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 55%,#1a1c40),#0d0e25)}
.ava.img img{width:100%;height:100%;object-fit:cover;object-position:50% 0;transform:scale(1.9);transform-origin:50% 6%;display:block}
.userchip .ava{border-radius:50%}

/* toggle */
.sw{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--mute);font-weight:700;cursor:pointer;user-select:none}
.sw input{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;cursor:pointer;margin:0;flex:0 0 auto}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .2s}
.sw input:checked{background:var(--acc-2)}
.sw input:checked::after{left:20px}
.pill{display:inline-flex;align-items:center;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(13,14,37,.7);font-weight:800;font-size:13px;white-space:nowrap}
.pill.price{font-family:var(--f-mono);font-size:15px;border-color:var(--acc);background:rgba(122,60,255,.2)}
.pill.r{border-color:var(--rc);color:var(--rc)}

/* case page */
.case-top{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 16px 20px;border-radius:20px;overflow:hidden;text-align:center;
  background:radial-gradient(420px 260px at 50% 45%,color-mix(in srgb,var(--c1) 34%,transparent),transparent 70%),linear-gradient(180deg,#160d38,#0d0e25);border:1px solid var(--line)}
.case-top .back{align-self:flex-start;margin:0}
.case-top h1{font-size:clamp(24px,4.4vw,36px);font-weight:900;text-transform:uppercase}
.case-art{width:min(520px,100%)}
.case-pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.open-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px}
.open-bar #openBtn{min-width:min(340px,100%)}
.open-bar .btn.acc{flex:0 1 auto;min-width:min(340px,100%)}
@media (max-width:640px){.open-bar{flex-direction:column;align-items:stretch}.open-bar .seg{justify-content:center}.open-bar .sw{align-self:center}}
.grid.rare4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.rare4 .item-s{font-size:15px}
@media (max-width:640px){.grid.rare4{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* drop result */
.sheet:has(.drop-hero){max-width:780px}
.drop-hero{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:center;padding:18px;border-radius:16px;overflow:hidden;
  background:radial-gradient(70% 90% at 30% 50%,color-mix(in srgb,var(--rc) 42%,transparent),transparent 70%),linear-gradient(135deg,#1c0f45,#0d0e25);border:1px solid color-mix(in srgb,var(--rc) 45%,var(--line))}
@media (max-width:600px){.drop-hero{grid-template-columns:1fr;text-align:center}.drop-pills{justify-content:center}}
.drop-img{aspect-ratio:4/3;animation:dropin .7s cubic-bezier(.2,.9,.3,1.2)}
.drop-img .skimg{filter:drop-shadow(0 0 24px color-mix(in srgb,var(--rc) 70%,transparent)) drop-shadow(0 12px 14px rgba(0,0,0,.6))}
@keyframes dropin{0%{transform:scale(.6) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.drop-info{display:flex;flex-direction:column;gap:8px;min-width:0}
.drop-info h3{font-size:clamp(22px,4vw,28px);font-weight:900}
.drop-pills{display:flex;gap:8px;flex-wrap:wrap}
.drop-act{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.lastdrops-h{font:800 14px var(--f-disp);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.lastdrops{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:560px){.lastdrops{grid-template-columns:repeat(3,minmax(0,1fr))}.lastdrops .item:nth-child(n+4){display:none}}

/* inventory */
.inv-panel{gap:12px}
.inv-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.inv-tools .seg{flex-wrap:wrap}
.inv-tools-r{display:flex;gap:8px;flex:1 1 300px;justify-content:flex-end}
.inv-tools-r .inp{height:40px;max-width:260px}
.inp.sel{width:auto;padding-right:10px;font-size:13px}
@media (max-width:640px){.inv-tools-r{flex-direction:column}.inv-tools-r .inp{max-width:none;width:100%}}

/* upgrade */
.up-slot{min-height:260px}
.up-slot-b{flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center}
.up-slot .item.big{width:min(260px,100%);align-self:center}
.up-sum{text-align:center;font-weight:700;margin-top:auto}
.balstake{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;border:1px solid var(--coin);background:rgba(255,197,58,.08);padding:6px;font-size:11px}
.balstake b{font-family:var(--f-mono);font-size:12px}
.balstake .coin{width:22px;height:22px}
.w-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.w-center small{font-size:12px;color:var(--mute);font-weight:700}
.w-center b{font:900 clamp(30px,8vw,40px)/1 var(--f-disp)}
.up-lists{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.up-lists{grid-template-columns:1fr}}
.up-lists .panel{gap:10px}

/* profile */
.prof{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.prof{grid-template-columns:1fr}}
.pside{display:flex;flex-direction:column;gap:12px;padding:20px 16px;border-radius:18px;background:var(--surf);border:1px solid var(--line)}
.pava{width:112px;height:112px;border-radius:50%;margin:0 auto;padding:4px;background:conic-gradient(from 200deg,var(--acc-2),#5b8cff,var(--acc),var(--acc-2));box-shadow:0 0 30px rgba(169,77,255,.45)}
.pava .ava{width:100%;height:100%;border-radius:50%;font-size:42px;border:3px solid var(--surf)}
.pnick{text-align:center;font:900 20px var(--f-disp);word-break:break-word}
.pid{text-align:center;color:var(--mute);font:600 12px var(--f-mono);margin-top:-8px}
.rank{align-self:center;padding:4px 12px;border-radius:999px;background:rgba(122,60,255,.2);border:1px solid var(--acc);font-weight:800;font-size:12px;color:#d9c8ff}
.pbal{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line)}
.pbal b{display:block;font-size:18px}
.pmenu{display:flex;flex-direction:column;gap:3px}
.pmenu button{display:flex;align-items:center;gap:11px;height:42px;padding:0 12px;border-radius:10px;color:var(--mute);font-weight:700;text-align:left;transition:background .15s,color .15s}
.pmenu button:hover{background:var(--surf-2);color:var(--fg)}
.pmenu button[aria-current=true]{background:rgba(122,60,255,.2);color:var(--fg);box-shadow:inset 3px 0 0 var(--acc-2)}
.pmenu svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
@media (max-width:860px){.pmenu{display:grid;grid-template-columns:1fr 1fr}.pmenu button{height:40px;font-size:13px}}
.pmain{display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:18px;background:var(--surf);border:1px solid var(--line);min-width:0}
@media (max-width:560px){.pmain{padding:14px}}

.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}

@media (max-width:640px){.pstats{grid-template-columns:1fr}}
.pstat{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line);min-width:0}
.pstat svg{width:36px;height:36px;flex:0 0 auto;fill:none;stroke:var(--acc-2);stroke-width:2.2;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(169,77,255,.5))}

.grid.fav{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.grid.fav{grid-template-columns:repeat(2,minmax(0,1fr))}}
.avas{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.avas button{border-radius:14px;border:1px solid var(--line);background:var(--bg-2);padding:5px;aspect-ratio:1;overflow:hidden;transition:border-color .15s,transform .15s}
.avas button:hover{transform:translateY(-2px)}
.avas button[aria-pressed=true]{border-color:var(--acc-2);box-shadow:0 0 0 2px var(--acc-2),0 0 18px -4px var(--acc-2)}
.avas .ava{width:100%;height:100%;border-radius:10px;font-size:26px}
.set-row{display:flex;flex-direction:column;gap:12px}
.w-center small:first-child{font-family:var(--f-body);color:var(--mute)}

.invite{width:100%;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:14px;border:2px solid var(--bad);background:rgba(255,77,99,.08);box-shadow:0 0 24px rgba(255,77,99,.25);text-align:left;transform:rotate(-1deg)}

/* ================= v3: темы, простор, новые разделы ================= */
:root{--card1:#16173c;--card2:#0d0e25;--hdr:rgba(8,9,26,.9);--g1:rgba(122,60,255,.22);--g2:rgba(60,40,160,.16);--theme-art:#0b0920;--side:236px}
body{background-image:radial-gradient(1000px 600px at 70% -10%,var(--g1),transparent 60%),radial-gradient(800px 500px at 0% 30%,var(--g2),transparent 60%);transition:background-color .3s}
.hdr{background:var(--hdr)}
.nav-bot{background:color-mix(in srgb,var(--bg) 94%,transparent)}
.sheet{background:linear-gradient(180deg,var(--surf-2),var(--surf));max-width:660px}
.case-tile{background:linear-gradient(180deg,var(--surf-2),var(--bg-2))}
.item{background:radial-gradient(85% 65% at 50% 40%,color-mix(in srgb,var(--rc) 32%,transparent),transparent 72%),linear-gradient(180deg,var(--card1),var(--card2))}
.btn.acc{color:var(--acc-ink)}
.seg button[aria-pressed="true"]{color:var(--acc-ink)}
.hero{background:radial-gradient(600px 400px at 75% 40%,color-mix(in srgb,var(--acc-2) 35%,transparent),transparent 70%),linear-gradient(135deg,var(--surf-2),var(--bg-2))}
.btn.red{background:rgba(255,77,99,.12);border:1px solid rgba(255,77,99,.5);color:#ff8a98}
.sub{margin:4px 0 0;font-size:14px}
.ph3{font-size:17px;font-weight:800}
.panel.hl{border-color:var(--acc-2);box-shadow:0 0 0 1px var(--acc-2),0 10px 40px -20px var(--acc-2)}
.spin.sm{width:22px;height:22px}

/* --- больше воздуха --- */
.wrap{max-width:1320px}
main.wrap{padding-block:30px 120px}
main>section{display:flex;flex-direction:column;gap:22px}
.panel{padding:20px;gap:14px;border-radius:18px}
.grid{gap:14px}
.tiles{gap:16px}
.sec-h{margin-top:6px}
.sec-h h2{font-size:24px}
@media (max-width:640px){main.wrap{padding-block:18px 120px}main>section{gap:18px}.panel{padding:16px}.sec-h h2{font-size:21px}}

/* --- навигация: значки, верх с иконками, левая колонка --- */
.nb{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:800 10px/18px var(--f-body);text-align:center;font-style:normal;box-shadow:0 0 0 2px var(--bg)}
.nav-top button,.nav-bot button{position:relative}
.nav-top .nav-extra{display:none}
.nav-top{margin-left:18px}
@media (min-width:960px) and (max-width:1420px){body:not(.nav-left) .nav-top button span{display:none}body:not(.nav-left) .nav-top button{padding:10px 12px}}
@media (min-width:960px){
  body.nav-left .hdr{backdrop-filter:none;-webkit-backdrop-filter:none;background:color-mix(in srgb,var(--bg) 97%,transparent)}
  body.nav-left .nav-top{position:fixed;left:0;top:calc(67px + env(safe-area-inset-top,0px));bottom:0;width:var(--side);margin:0;flex-direction:column;gap:4px;padding:18px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);border-right:1px solid var(--line);overflow:auto;z-index:20}
  body.nav-left .nav-top button{justify-content:flex-start;padding:12px 14px;font-size:15px;border-radius:12px}
  body.nav-left .nav-top button[aria-current="true"]{background:color-mix(in srgb,var(--acc) 22%,transparent);box-shadow:inset 3px 0 0 var(--acc-2)}
  body.nav-left .nav-top .nb{top:50%;right:12px;transform:translateY(-50%)}
  body.nav-left .nav-top .nav-extra{display:flex;flex-direction:column;gap:4px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
  body.nav-left main.wrap,body.nav-left .news{margin-left:var(--side)}
  body.nav-left main.wrap{max-width:none;padding-left:32px;padding-right:32px}
}
.more-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.more-i{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line);font-weight:700;font-size:13px}
.more-i svg{width:26px;height:26px;fill:none;stroke:var(--acc-2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* --- что нового --- */
.news{margin-bottom:6px}
.news-in{position:relative;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:16px;overflow:hidden;background:linear-gradient(100deg,color-mix(in srgb,var(--acc) 45%,var(--surf)),var(--surf) 60%);border:1px solid var(--acc-2);box-shadow:0 10px 40px -18px var(--acc-2);animation:rise .4s}
.news-in::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.12) 45%,transparent 60%);animation:shine 3.5s infinite;pointer-events:none}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.news-tag{font:900 12px var(--f-disp);text-transform:uppercase;letter-spacing:.08em;padding:5px 10px;border-radius:8px;background:var(--acc-2);color:var(--acc-ink)}
.news-in b{flex:1 1 220px}
.news-act{display:flex;gap:8px;align-items:center}
.wn-t{font-size:24px;font-weight:900;background:linear-gradient(90deg,var(--acc-2),#ffd76a);-webkit-background-clip:text;background-clip:text;color:transparent}
.wn-list{display:flex;flex-direction:column;gap:10px}
.wn-i{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);animation:rise .4s both;animation-delay:calc(var(--i)*60ms)}
.wn-i b{color:var(--acc-2)}
.wn-i span{font-size:14px;color:var(--fg)}

/* --- новые кейсы большими плитками --- */
.tiles.big{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1050px){.tiles.big{grid-template-columns:repeat(2,minmax(0,1fr))}}
.newt{padding:0;overflow:hidden;align-items:stretch;gap:0;text-align:left;border-radius:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 22%,var(--bg-2)),var(--bg-2))}
.newt .badge{left:12px;top:12px}
.newt-art{position:relative;display:block;padding:18px 10px 6px;background:radial-gradient(70% 70% at 50% 60%,color-mix(in srgb,var(--c1) 55%,transparent),transparent 70%)}
.newt-art .crate{height:170px}
@media (max-width:560px){.newt-art .crate{height:130px}}
.newt-b{display:flex;flex-direction:column;gap:6px;padding:12px 16px 16px}
.newt-b .ct-n{font-size:16px;white-space:normal}
.newt-b .btn{margin-top:4px;width:100%}

/* --- режимы битв, джекпот --- */
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:800px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.modes button{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line);text-align:left;transition:border-color .15s,transform .15s}
.modes button b{font-size:15px}
.modes button span{font-size:12.5px;color:var(--mute);line-height:1.35}
.modes button[aria-pressed="true"]{border-color:var(--acc-2);background:color-mix(in srgb,var(--acc) 18%,var(--bg-2));box-shadow:0 0 0 1px var(--acc-2)}
.bt-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
#bGo{width:100%}
.invite-note{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--acc) 15%,var(--bg-2));border:1px solid var(--acc-2);font-size:14px}
.invite-note .in-t{flex:1}
.bcard.forme{border-color:var(--good);box-shadow:0 0 0 1px var(--good)}
.rw{display:block;font:700 11px var(--f-mono);color:var(--coin);font-style:normal;margin-left:auto}
.jp{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:16px;background:var(--surf);border:1px solid var(--line)}
.jp-h{font-weight:800;font-size:14px;color:var(--mute)}
.jp-bar{position:relative;height:46px;border-radius:12px;overflow:hidden;background:var(--bg-2)}
.jp-bar i{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border-right:2px solid var(--bg)}
.jp-bar i span{font:800 11px var(--f-body);color:#0a0a14;white-space:nowrap;padding:0 4px}
.jp-ptr{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 12px #fff;border-radius:2px}

/* --- апгрейдер: крутится кольцо --- */
.ring-rot{position:absolute;inset:0;will-change:transform}
.ring-rot svg{width:100%;height:100%;display:block}
.wheel .pointer{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid #fff;filter:drop-shadow(0 0 8px var(--acc-2));z-index:3}
.wheel.spinning .w-center b{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.06);filter:brightness(1.3)}}
.wheel.won .pointer{border-top-color:var(--good)}.wheel.lost .pointer{border-top-color:var(--bad)}

/* --- карточка скина с ценами --- */
.sk-head{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:center;padding:14px;border-radius:16px;background:radial-gradient(70% 90% at 30% 50%,color-mix(in srgb,var(--rc) 40%,transparent),transparent 70%),var(--bg-2);border:1px solid color-mix(in srgb,var(--rc) 40%,var(--line))}
@media (max-width:560px){.sk-head{grid-template-columns:1fr;text-align:center}.sk-info{align-items:center}}
.sk-img{aspect-ratio:4/3}
.sk-info{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sk-info h3{font-size:24px;font-weight:900}
.sk-prices{display:flex;flex-direction:column;gap:8px}
.pr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line)}
.pr span{color:var(--mute);font-weight:700}
.pr b{font-family:var(--f-mono);font-size:16px;text-align:right}
button.item[data-sk]{cursor:pointer}

/* --- аватарки эмодзи и абстракция --- */
.ava.emo{background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 45%,#1a1c40),#0d0e25);font-size:1.2em}
.ava.emo i{font-style:normal;line-height:1;font-size:calc(1em + 4px)}
.ava.sm.emo i{font-size:13px}
.ava.abs{padding:0;overflow:hidden;background:#0d0e25}
.ava.abs svg{width:100%;height:100%;display:block}
.ava.grp{background:color-mix(in srgb,var(--acc) 30%,var(--surf-2))}
.ava.grp svg{width:60%;height:60%;fill:none;stroke:#fff;stroke-width:1.8}

/* --- друзья --- */
.myid{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-radius:16px;background:linear-gradient(100deg,color-mix(in srgb,var(--acc) 25%,var(--surf)),var(--surf));border:1px solid var(--line)}
.myid>div{display:flex;flex-direction:column;margin-right:auto}
.myid b{font-size:28px;letter-spacing:.12em}
.myid.sm{padding:10px 12px;background:var(--bg-2)}
.myid.sm>span{margin-right:auto}
.btn svg,.icbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.fr-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:960px){.fr-layout{grid-template-columns:1fr}}
.fr-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.search{position:relative;flex:1 1 220px;max-width:320px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--mute);stroke-width:2}
.search .inp{padding-left:38px;height:42px}
.frow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow>.ava{width:44px;height:44px;border-radius:50%;flex:0 0 auto}
.frow.big>.ava{width:56px;height:56px}
.fr-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.fr-t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr-t small,.fr-t .st-on,.fr-t .st-off{font-size:12.5px}
.st-on{color:var(--good)}.st-on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
.st-off{color:var(--mute)}
.lv{font:700 11px var(--f-mono);color:var(--acc-2)}
.fr-act{display:flex;gap:6px;align-items:center}
@media (max-width:560px){.hide-s{display:none}.fr-act .btn{padding:0 10px}}
.brow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px}
.brow.me{background:color-mix(in srgb,var(--acc) 18%,transparent)}
.brow .bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pos-n{width:22px;text-align:center;font-family:var(--f-mono);color:var(--mute)}
.brow:nth-child(3) .pos-n{color:#ffd76a}.brow:nth-child(4) .pos-n{color:#c8d0e0}.brow:nth-child(5) .pos-n{color:#e0a070}
.col-btns{display:flex;flex-direction:column;gap:8px}
.pick-fr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:260px;overflow:auto}
.pick-fr button{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);font-weight:700;text-align:left;min-width:0}
.pick-fr button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-fr button[aria-pressed="true"]{border-color:var(--acc-2);box-shadow:0 0 0 1px var(--acc-2)}
.mem{display:flex;flex-direction:column;max-height:300px;overflow:auto}

/* --- аккаунт: боковое меню --- */
.ashell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.ashell{grid-template-columns:1fr}}
.acct-side{position:sticky;top:90px;display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:18px;background:var(--surf);border:1px solid var(--line)}
@media (max-width:860px){.acct-side{position:static;flex-direction:row;overflow-x:auto;padding:6px;scrollbar-width:none}.acct-side::-webkit-scrollbar{display:none}}
.acct-side button{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:var(--mute);font-weight:700;white-space:nowrap}
.acct-side button:hover{color:var(--fg);background:var(--surf-2)}
.acct-side button[aria-current="true"]{color:var(--fg);background:color-mix(in srgb,var(--acc) 22%,transparent);box-shadow:inset 3px 0 0 var(--acc-2)}
.acct-side svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acct-main{display:flex;flex-direction:column;gap:18px;min-width:0}

/* --- кастомизация --- */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:560px){.themes{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.th-art{height:74px}}
.th{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--bg-2);text-align:left;transition:transform .15s,border-color .15s}
.th:hover{transform:translateY(-3px)}
.th.on{border-color:var(--acc-2);box-shadow:0 0 0 2px var(--acc-2),0 12px 30px -12px var(--acc-2)}
.th-art{position:relative;height:96px;display:grid;place-items:center}
.th-art svg,.pf-banner svg{width:44px;height:30px;fill:none;stroke:#fff;stroke-width:1.6;filter:drop-shadow(0 0 8px rgba(255,255,255,.7));opacity:.9}
.th-b{display:flex;flex-direction:column;padding:10px 12px}
.th-b small{color:var(--mute);font-size:12px}
.th.on .th-b small{color:var(--acc-2);font-weight:800}
.avas{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px}
.avas button{border-radius:50%;padding:4px}
.avas .ava{border-radius:50%;font-size:28px}
.navpick{display:flex;gap:12px;flex-wrap:wrap}
.navpick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line);width:150px}
.navpick button[aria-pressed="true"]{border-color:var(--acc-2);box-shadow:0 0 0 1px var(--acc-2)}
.np{position:relative;width:110px;height:68px;border-radius:8px;background:var(--surf);border:1px solid var(--line);overflow:hidden}
.np i{position:absolute;background:var(--acc-2);border-radius:3px;opacity:.85}
.np-top i:first-child{left:6px;right:6px;top:6px;height:9px}.np-top i:last-child{left:6px;right:6px;top:20px;bottom:6px;opacity:.25}
.np-left i:first-child{left:6px;top:6px;bottom:6px;width:22px}.np-left i:last-child{left:32px;right:6px;top:6px;bottom:6px;opacity:.25}
.vol{display:flex;align-items:center;gap:12px}
.vol input{flex:1;max-width:320px;accent-color:var(--acc-2)}
.vol b{font-family:var(--f-mono);min-width:44px}

/* --- профиль --- */
.pf{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:1100px){.pf{grid-template-columns:1fr}}
.pf-main,.pf-side{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1100px){.pf-side{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
.pf-card{display:flex;flex-direction:column;gap:16px;padding:0 0 20px;border-radius:20px;overflow:hidden;background:var(--surf);border:1px solid var(--line)}
.pf-card>.lvl,.pf-card>.pstats{margin:0 20px}
.pf-banner{height:150px;display:grid;place-items:center;position:relative}
.pf-banner::after{content:"";position:absolute;inset:auto 0 0;height:60%;background:linear-gradient(transparent,var(--surf))}
.pf-banner svg{width:110px;height:76px;opacity:.55}
.pf-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:-64px 20px 0;position:relative;z-index:2}
.pf-ava{position:relative;width:118px;height:118px;border-radius:50%;padding:4px;background:conic-gradient(from 200deg,var(--acc-2),#5b8cff,var(--acc),var(--acc-2));box-shadow:0 0 30px color-mix(in srgb,var(--acc-2) 60%,transparent);flex:0 0 auto}
.pf-ava .ava{width:100%;height:100%;border-radius:50%;font-size:44px;border:4px solid var(--surf)}
.pf-edit{position:absolute;right:2px;bottom:4px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--acc);border:3px solid var(--surf)}
.pf-edit svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2}
.pf-name{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.pf-name h2{font-size:28px;font-weight:900;word-break:break-word}
.pf-sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.pf-sub .lnk{display:inline-flex;align-items:center;gap:6px;color:var(--mute)}
.pf-sub svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.pf-btns{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:8px}
.cst{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.cst-i{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line);min-width:0}
.cst-i .crate,.cst-i .caseimg{height:80px}
.cst-i b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cst-i span{color:var(--acc-2);font-weight:800}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ach{display:flex;flex-direction:column;gap:3px;padding:12px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line);opacity:.45;filter:grayscale(1)}
.ach.ok{opacity:1;filter:none;border-color:color-mix(in srgb,var(--coin) 60%,var(--line));background:linear-gradient(160deg,rgba(255,197,58,.12),var(--bg-2))}
.ach svg{width:24px;height:24px;fill:var(--coin);stroke:none}
.ach small{color:var(--mute);font-size:12px}
.th-mini{height:90px;border-radius:12px;display:flex;align-items:flex-end;padding:10px;border:1px solid var(--line)}
.th-mini b{background:rgba(0,0,0,.55);padding:4px 10px;border-radius:8px}
.fav-case{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border-radius:14px;background:radial-gradient(70% 70% at 50% 40%,color-mix(in srgb,var(--c1) 40%,transparent),transparent 70%),var(--bg-2);border:1px solid var(--line)}
.fav-case .crate{height:110px}
.pf-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:8px;border-radius:16px;background:var(--surf);border:1px solid var(--line)}
.pf-tabs button{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;font-weight:700;color:var(--mute)}
.pf-tabs button:hover{color:var(--fg);background:var(--surf-2)}
.pf-tabs svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}

/* --- чаты --- */
.chat-wrap{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;height:calc(100dvh - 210px);min-height:460px}
.chat-list{overflow:hidden;display:flex;flex-direction:column}
#chL{overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -8px;padding:0 4px}
.chi{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;text-align:left;min-width:0}
.chi:hover{background:var(--surf-2)}
.chi.on{background:color-mix(in srgb,var(--acc) 20%,transparent)}
.chi>.ava{width:46px;height:46px;border-radius:50%;flex:0 0 auto}
.chi-t{flex:1;min-width:0;display:flex;flex-direction:column}
.chi-t b,.chi-t small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chi-t small{color:var(--mute);font-size:13px}
.chi-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;color:var(--mute);font-size:11px}
.chi-r .nb{position:static;box-shadow:none}
.chat-main{padding:0;overflow:hidden;gap:0}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--fg);padding:30px;text-align:center}
.chat-empty svg{width:56px;height:56px;fill:none;stroke:var(--acc-2);stroke-width:1.5;margin-bottom:6px}
.ch-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surf-2)}
.ch-head>.ava{width:40px;height:40px;border-radius:50%}
.ch-t{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left}
.ch-t small{color:var(--mute);font-size:12px}
.ch-back{display:none}
.ch-msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:16px;background:radial-gradient(600px 300px at 80% 0%,var(--g2),transparent 70%)}
.msg{display:flex;align-items:flex-end;gap:8px;max-width:84%}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg .ava,.ava-sp{width:28px;height:28px;border-radius:50%;flex:0 0 auto}
.bub{display:flex;flex-direction:column;gap:4px;padding:9px 12px 6px;border-radius:16px 16px 16px 4px;background:var(--surf-2);border:1px solid var(--line);min-width:0}
.msg.mine .bub{border-radius:16px 16px 4px 16px;background:linear-gradient(160deg,var(--acc-2),var(--acc));color:var(--acc-ink);border:0}
.bub p{margin:0;white-space:pre-wrap;word-break:break-word}
.bub small{align-self:flex-end;font-size:10.5px;opacity:.65}
.bub .nm{font-size:12.5px}
.msg.sys{align-self:center;max-width:90%;font-size:12px;color:var(--mute);background:var(--bg-2);padding:5px 12px;border-radius:999px}
.composer{border-top:1px solid var(--line);padding:10px;background:var(--surf);display:flex;flex-direction:column;gap:8px}
.comp-row{display:flex;align-items:flex-end;gap:8px}
.comp-row textarea{flex:1;min-height:44px;max-height:120px;resize:none;padding:11px 14px;line-height:1.35;font-weight:600}
.comp-row .icbtn{flex:0 0 auto;height:44px;width:44px}
.btn.send{width:48px;padding:0;flex:0 0 auto;height:44px}
.btn.send svg{width:20px;height:20px}
.att-voice.rec{width:auto;padding:0 12px;color:#fff;background:var(--bad);border-color:var(--bad);font:700 13px var(--f-mono);gap:6px;display:inline-flex;align-items:center}
.att-voice .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.att-list{display:flex;gap:8px;flex-wrap:wrap}
.att-chip{position:relative;display:flex;align-items:center;gap:6px;height:56px;padding:0 10px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line)}
.att-chip img{height:46px;width:46px;object-fit:cover;border-radius:8px}
.att-chip svg{width:18px;height:18px;fill:none;stroke:var(--acc-2);stroke-width:2}
.att-chip button{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font-size:13px;line-height:1}
.media{display:flex;flex-direction:column;gap:6px}
.m-img{display:block;border-radius:12px;overflow:hidden;max-width:260px}
.m-img img{display:block;width:100%;max-height:300px;object-fit:cover;background:var(--bg-2);min-height:80px}
.m-aud{display:flex;align-items:center;gap:6px}
.m-aud audio{height:36px;max-width:230px}
.m-aud .m-ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.zoom-img{width:100%;max-height:75vh;object-fit:contain;border-radius:12px}
@media (max-width:860px){
  .chat-wrap{grid-template-columns:1fr;height:calc(100dvh - 190px)}
  .chat-wrap.has-open .chat-list{display:none}
  .chat-wrap:not(.has-open) .chat-main{display:none}
  .ch-back{display:grid}
}

/* --- форум --- */
.composer-big textarea{resize:vertical;min-height:90px;padding:12px 14px;font-weight:600;line-height:1.4}
.composer-big .comp-row{align-items:center}
.posts{display:flex;flex-direction:column;gap:12px}
.post{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:16px;background:var(--surf);border:1px solid var(--line)}
.post-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.post-h small{margin-right:auto}
.post-t{margin:0;white-space:pre-wrap;word-break:break-word;font-size:15px}
.st-pill{font:800 11px var(--f-body);padding:4px 10px;border-radius:999px;color:var(--sc);border:1px solid var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent)}
.reply{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--acc) 14%,var(--bg-2));border-left:3px solid var(--acc-2)}
.reply b{font-size:12px;color:var(--acc-2);text-transform:uppercase;letter-spacing:.06em}
.reply p{margin:4px 0 0;white-space:pre-wrap}
@media (max-width:560px){.comp-hint{display:none}}
.post-f{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.vote{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);font-weight:800}
.vote svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4}
.vote.on{border-color:var(--acc-2);color:var(--acc-2);background:color-mix(in srgb,var(--acc) 16%,var(--bg-2))}

/* --- оптимизация: длинные сетки не рисуются за экраном --- */
#invGrid>.item,#upCat>.item,#upInv>.item,.posts>.post{content-visibility:auto;contain-intrinsic-size:auto 230px}
.posts>.post{contain-intrinsic-size:auto 160px}

.comp-row .sp{display:none}
@media (max-width:560px){.comp-row .sp{display:block}}

.luck-note{max-width:46ch;font-size:12px;line-height:1.35}

/* ================= 1.3.1 ================= */
/* окно выпадения: ничего не сжимается, кнопки всегда внизу */
.sheet>*{flex-shrink:0}
.sheet-foot{position:sticky;bottom:-22px;z-index:4;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px -22px -22px;padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--surf) 30%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-top:1px solid var(--line)}
.sheet-foot{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.sheet-foot .btn{width:100%;min-width:0;height:52px;white-space:normal;line-height:1.15;padding:0 10px;text-align:center}
@media (max-width:600px){
  .drop-img{max-height:30vh;margin:0 auto;width:100%}
  .drop-hero{padding:14px;gap:8px}
  .drop-info h3{font-size:22px}
  .lastdrops .item:nth-child(n+4){display:none}
}
/* живая лента дропов */
.livebar{position:relative;display:flex;align-items:center;gap:10px;height:62px;padding:0 max(12px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--line);overflow:hidden}
body.nav-left .livebar{margin-left:var(--side)}
.lb-tag{flex:0 0 auto;display:flex;align-items:center;gap:6px;font:900 11px var(--f-disp);letter-spacing:.1em;color:var(--bad);padding:6px 9px;border-radius:8px;background:rgba(255,77,99,.1);border:1px solid rgba(255,77,99,.35)}
.lb-tag i{width:7px;height:7px;border-radius:50%;background:var(--bad);animation:blink 1.2s infinite}
.lb-track{display:flex;gap:8px;overflow:hidden;flex:1;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.lc{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:48px;padding:4px 10px 4px 4px;border-radius:10px;background:radial-gradient(80% 120% at 20% 50%,color-mix(in srgb,var(--rc) 35%,transparent),transparent 70%),var(--surf);border:1px solid color-mix(in srgb,var(--rc) 40%,var(--line));border-bottom:2px solid var(--rc);max-width:190px}
.lc.in{animation:lcin .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes lcin{from{transform:translateX(-60px) scale(.8);opacity:0}}
.lc-ic{width:52px;height:38px;flex:0 0 auto}
.lc-t{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.lc-t b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-t small{font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc .bt{font-size:10px;color:var(--mute);font-weight:700}
.wc-p{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.wc-p small{font:600 10.5px var(--f-body);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc.bot{opacity:.92}
/* карточный режим */
.cards-legend{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--acc) 12%,var(--surf));border:1px dashed var(--acc-2);font-size:13px}
.cards-legend b{color:var(--acc-2)}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;aspect-ratio:5/7;padding:22px 8px 22px;border-radius:12px;color:#14141c;background:linear-gradient(160deg,#ffffff,#e9e9f2);border:2px solid var(--rc);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 0 0 3px #fff;animation:dealin .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dealin{from{transform:translateY(-30px) rotate(-12deg) scale(.7);opacity:0}}
.pcard.red{color:#d81f3c}
.pc-c{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.9;font-family:var(--f-disp)}
.pc-c b{font-size:17px;font-weight:900}.pc-c i{font-style:normal;font-size:15px}
.pc-c.tl{left:7px;top:6px}.pc-c.br{right:7px;bottom:6px;transform:rotate(180deg)}
.pc-img{flex:1;width:100%;display:grid;place-items:center;min-height:0;background:radial-gradient(closest-side,color-mix(in srgb,var(--rc) 35%,transparent),transparent);border-radius:8px}
.pc-img .skimg,.pc-img .skfb{max-height:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.pc-n{font:800 11px var(--f-body);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#14141c}
.pc-p{font:700 10px var(--f-mono);color:#555}
.pcard.mini{padding:18px 5px 16px;border-radius:9px}
.pcard.mini .pc-c b{font-size:13px}.pcard.mini .pc-c i{font-size:12px}.pcard.mini .pc-n{font-size:9.5px}
.drops .pcard{width:100%}
/* FAQ */
.faq-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.faq-grid{grid-template-columns:1fr}}
.faq{border-bottom:1px solid var(--line);padding:4px 0}
.faq summary{cursor:pointer;font-weight:800;padding:10px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::after{content:"+";color:var(--acc-2);font-size:20px;line-height:1}
.faq[open] summary::after{content:"−"}
.faq p{margin:0 0 12px;color:var(--mute);font-size:14.5px}
.rules ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.wn-old{margin-top:4px}
.wn-old summary{cursor:pointer;font-weight:800;color:var(--mute);padding:8px 0}
.pubid{display:inline-block;margin-left:6px;font:700 11px var(--f-mono);color:var(--coin)}

.ava.meme{border-radius:24%!important}
.avas button:has(.meme){border-radius:22%}
.pf-ava:has(.meme){border-radius:26%}.pf-ava:has(.meme) .ava{border-radius:22%!important}
/* 1.3.2 витрина */
.vault{display:flex;flex-direction:column;gap:10px}
.vault-shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--line);position:relative}
.vault-it{position:relative;padding-bottom:10px}
.vault-it::after{content:"";position:absolute;left:6%;right:6%;bottom:0;height:6px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(255,215,120,.45),transparent);box-shadow:0 0 14px rgba(255,200,90,.35)}
.vault-it .item{width:100%}
.vault-sum{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}
.vault-sum b{color:var(--fg)}
@media(max-width:600px){.vault-shelf{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px;gap:8px}}
/* 1.3.2 плашки на главной */
.hero-wrap{position:relative;display:grid}
.hero-wrap>.slide{grid-area:1/1;opacity:0;visibility:hidden;transform:translateX(18px);transition:opacity .45s ease,transform .45s ease,visibility 0s .45s}
.hero-wrap>.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease,transform .45s ease}
.hero.slide{background:radial-gradient(600px 400px at 75% 40%,color-mix(in srgb,var(--hc1) 38%,transparent),transparent 70%),linear-gradient(135deg,var(--surf-2),color-mix(in srgb,var(--hc2) 70%,var(--bg-2)))}
.hero.slide h1 span{background:linear-gradient(90deg,var(--hc1),color-mix(in srgb,var(--hc1) 40%,#fff))!important;-webkit-background-clip:text!important;background-clip:text!important}
.hero-dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:7px;z-index:5;pointer-events:none}
.hero-dots button{pointer-events:auto;width:9px;height:9px;border-radius:5px;border:0;padding:0;background:rgba(255,255,255,.28);transition:width .25s,background .25s;cursor:pointer}
.hero-dots button[aria-pressed=true]{width:26px;background:var(--fg)}
@media(max-width:800px){.hero-dots{bottom:6px}.hero.slide{padding-bottom:26px}}
/* 1.3.2 апгрейдер: стрелка */
.up-opts{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.wheel .needle{position:absolute;inset:0;display:none;will-change:transform;z-index:3;pointer-events:none}
.wheel .needle i{position:absolute;left:50%;top:9%;bottom:50%;width:6px;margin-left:-3px;border-radius:3px;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--acc-2) 70%,#fff));box-shadow:0 0 12px var(--acc-2)}
.wheel .needle i::before{content:"";position:absolute;left:50%;top:-12px;transform:translateX(-50%);border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:16px solid #fff;filter:drop-shadow(0 0 6px var(--acc-2))}
.wheel.arrow .needle{display:block}
.wheel.arrow .pointer{display:none}
.wheel.arrow .w-center{z-index:4}
.wheel.won .needle i{background:var(--good)}.wheel.won .needle i::before{border-bottom-color:var(--good)}
.wheel.lost .needle i{background:var(--bad)}.wheel.lost .needle i::before{border-bottom-color:var(--bad)}
.tiles.lux .case-tile{background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c1) 30%,transparent),transparent 70%),var(--surf);border-color:color-mix(in srgb,var(--c1) 45%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--c1) 20%,transparent),0 10px 30px -12px color-mix(in srgb,var(--c1) 60%,transparent)}
.tiles.lux .case-tile .ct-p{color:#ffd23a}
/* 1.3.2 дурак */
.dk{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:14px;background:radial-gradient(120% 120% at 50% 0%,rgba(30,120,70,.25),transparent 60%),var(--surf);display:flex;flex-direction:column;gap:12px}
.dk-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.dk-h b{font-size:18px}
.dk-tr{padding:4px 10px;border-radius:8px;background:#fff;color:#111;font-weight:800}.dk-tr.red{color:#d21f3c}
.dk-h #dkSkip{margin-left:auto}
.dk-hands{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.dk-p{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,opacity .2s}
.dk-p.att{border-color:var(--acc-2);box-shadow:0 0 0 1px var(--acc-2)}.dk-p.def{border-color:#ffb03a}.dk-p.out{opacity:.55}
.dk-pn{display:flex;align-items:center;gap:8px;min-width:0}.dk-pn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dk-pn small{margin-left:auto;color:var(--mute);white-space:nowrap}
.dk-cards{display:flex;flex-wrap:wrap;gap:4px}.dk-cards .pcard.mini{width:46px}
.dk-more{align-self:center;color:var(--mute);font-size:12px}

function rebuildEconomy(){
  const lOf=(e,P,mu)=>-Math.pow(Math.log(Math.max(e,.01)/P)-mu,2)/(2*SIG*SIG);
  const wsOf=(names,P,mu)=>{const ls=names.map(n=>lOf(expP(SK[n]),P,mu)),mx=Math.max(...ls);return ls.map(l=>Math.exp(l-mx))};
  const evW2=(names,P,mu)=>{const ws=wsOf(names,P,mu);let t=0,e=0;names.forEach((n,i)=>{t+=ws[i];e+=ws[i]*expP(SK[n])});return t?e/t:0};
  CASES.length=0;
  for(const o of OFFICIAL){const items=[];for(const k of ['g','r','k','p','b'])for(const n of o[k])items.push({n,w:ODDS[k]/o[k].length});CASES.push({id:o.id,name:o.name,sub:o.name+' Case · '+o.year,sec:'cs2',col:o.col,items})}
  for(const o of CUSTOM){
    const names=[...new Set(o.items==='AGENTS'?AGENT_NAMES:o.items)].filter(n=>SK[n]);
    const P=o.price,target=P*RTP;let lo=-8,hi=8;for(let i=0;i<60;i++){const m=(lo+hi)/2;evW2(names,P,m)<target?lo=m:hi=m}const mu=(lo+hi)/2;
    const ev=evW2(names,P,mu),price=Math.abs(ev-target)/target<.03?P:null;
    CASES.push({id:o.id,name:o.name,sub:o.sec==='quick'?'Быстрый кейс':o.sec==='new'?'Новый кейс':o.sec==='lux'?'Дорогой кейс':o.sec==='hw'?'Хэллоуин · за очки ивента':o.sec==='hl'?'Хэллоуин · временный кейс':o.sec==='theme'?'Тематический кейс':o.id==='agents'?'Агенты CS2':'Кейс Занос',sec:o.sec,col:o.col,badge:o.badge,fixed:price,want:P,pts:o.pts,items:(ws=>names.map((n,i)=>({n,w:Math.max(1e-9,ws[i])})))(wsOf(names,P,mu))});
  }
  for(const c of CASES){
    const tot=c.items.reduce((a,x)=>a+x.w,0);c.items.forEach(x=>x.w/=tot);
    c.ev=c.items.reduce((a,x)=>a+x.w*expP(SK[x.n]),0);

    c.top=[...c.items].sort((a,b)=>expP(SK[b.n])-expP(SK[a.n]))[0].n;
    c.groups=[...new Set(c.items.map(x=>SK[x.n].rar))].sort((a,b)=>RORD.indexOf(a)-RORD.indexOf(b));

  CATALOG.length=0;for(const s of Object.values(SK)){if(s.cls==='agent')CATALOG.push({n:s.name,w:null,st:false,p:priceOf(s.name,null,false)});else for(const w of [0,2,4])CATALOG.push({n:s.name,w,st:false,p:priceOf(s.name,w,false)})}
  CATALOG.sort((a,b)=>a.p-b.p);
}

async function compressImage(file){

    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);

  }finally{URL.revokeObjectURL(url)}
}
