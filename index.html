<script>
/* 2.1.1: если сайт долго не может достучаться до сервера — объясняем, что делать, вместо вечной загрузки */
setTimeout(function(){try{
  var g=document.getElementById('gate'),b=document.getElementById('gBody');
  if(!g||g.hidden||!b||!b.querySelector('.spin')||document.getElementById('netDog'))return;
  var d=document.createElement('div');d.id='netDog';d.style.cssText='max-width:440px;text-align:center;font-size:14px;line-height:1.45;opacity:.95';
  d.innerHTML='<p style="margin:6px 0">Сервер долго не отвечает. Проверяю связь…</p>';b.appendChild(d);
  var C=window.ZANOS||{},url=(C.url||'').replace(/\/$/,''),done=false;
  var say=function(ok){if(done)return;done=true;d.innerHTML=ok?'<p style="margin:6px 0">Связь с сервером есть, но он отвечает медленно. Подожди ещё немного или обнови страницу.</p><button class="btn acc" type="button" onclick="location.reload()">Обновить страницу</button>':'<p style="margin:6px 0"><b>Не получается достучаться до сервера.</b> Похоже, интернет-провайдер ограничивает доступ (так бывает с домашним интернетом).</p><p style="margin:6px 0;opacity:.85">Попробуй: раздай интернет с телефона · включи VPN · обнови страницу</p><button class="btn acc" type="button" onclick="location.reload()">Обновить страницу</button>'};
  if(!url){say(false);return}
  var t=setTimeout(function(){say(false)},8000);
  fetch(url+'/auth/v1/health',{headers:{apikey:C.key||''},cache:'no-store'}).then(function(r){clearTimeout(t);say(r.status<500)}).catch(function(){clearTimeout(t);say(false)});
}catch(e){}},15000);
</script>
