/* ================= SPINNER ================= */
function tf(el){const t=getComputedStyle(el).transform;if(!t||t==='none')return{x:0,y:0,a:1,b:0};const m=new DOMMatrixReadOnly(t);return{x:m.m41,y:m.m42,a:m.a,b:m.b}}
function spin(wrap,winIdx,dur,vertical,ticks){
  return new Promise(res=>{
    const track=wrap.querySelector('.track'),first=track.children[0];
    const size=vertical?first.offsetHeight:first.offsetWidth,gap=parseFloat(getComputedStyle(track).gap)||0,step=size+gap;
    const view=vertical?wrap.clientHeight:wrap.clientWidth,exact=-(winIdx*step+size/2-view/2),target=exact+(Math.random()-.5)*size*.82,ax=vertical?'Y':'X';
    track.style.transition='none';track.style.transform=`translate${ax}(0px)`;void track.offsetWidth;
    track.style.transition=`transform ${dur}ms cubic-bezier(.06,.55,.08,1)`;track.style.transform=`translate${ax}(${target}px)`;
    let last=-1;const t0=performance.now();
    const loop=()=>{
      if(ticks){const p=vertical?tf(track).y:tf(track).x;const i=Math.floor((-p+view/2)/step);if(i!==last){last=i;SFX.tick()}}
      if(performance.now()-t0<dur+30)requestAnimationFrame(loop);
      else{track.style.transition='transform .4s ease-in-out';track.style.transform=`translate${ax}(${exact}px)`;setTimeout(()=>{track.children[winIdx].classList.add('win');res()},420)}
    };
    requestAnimationFrame(loop);
  });
}

}

async function openCase(c,n){
  if(busy)return;const cost=c.price*n;
  if(c.pts){if((S.evPts||0)<c.pts*n){toast('Не хватает очков ивента. Играй, и они накапают');return}}
  else if(S.bal<cost){toast('Не хватает фантиков. Пополни баланс');openDeposit();return}
  busy=true;$('#openBtn').disabled=true;
  let r;try{r=await rpc(c.pts?'zb_ev_open':'zb_open_case',{p_case:c.id,p_n:n})}catch(e){busy=false;$('#openBtn').disabled=false;toast(errMsg(e));SFX.lose();return}
  if(c.pts){S.evPts=+r.pts;if(EV.d)EV.d.pts=S.evPts}else{S.bal=r2(S.bal-cost);updBal()}SFX.open();
  const bc=$('#bigCrate .crate')||$('#bigCrate .caseimg');if(bc){bc.classList.add('shake');setTimeout(()=>bc.classList.remove('shake'),1100)}
  const drops=(r.items||[]).map(toItem);
  const Wn=52,show=drops.slice(0,5);
  $('#rolls').innerHTML=show.map(d=>`<div class="roul${n>1?' compact':''}"><div class="track">${reelItems(c,d,58,Wn).map(x=>card(x,{fx:false})).join('')}</div><i class="mark"></i></div>`).join('');
  const dur=S.fast?SPEED.caseF:SPEED.caseN;
  await Promise.all($$('#rolls .roul').map((w,i)=>spin(w,Wn,dur+i*220,false,i===0)));
  drops.forEach(d=>{S.inv.unshift(d);if(!S.best||d.p>S.best.p)S.best={...d}});gotItems(drops);
  S.bal=+r.bal;updBal();S.opened+=n;busy=false;$('#openBtn').disabled=false;
  showResult(drops,cost);pollFeed();
}
function verdict(total,cost,drops){
  const knife=drops.some(d=>SK[d.n].rar==='g'),ratio=total/cost;
  if(knife)return['Нож?! Скриншоть, пока Габен не забрал','hot'];
  if(ratio>=10)return['Занос века','hot'];
  if(ratio>=2)return['Окуп! Изи катка','hot'];
  if(ratio>=1)return['Окуп. Габен одобряет','hot'];
  if(ratio>=.4)return['Почти окуп. Ещё разок?','cold'];
  return[pick(['Не окуп. Классика','Ну, хоть не пустой','Минус вайб','Это был разогрев']),'cold'];
}

  }else{
    body=`<div class="res-grid">${drops.map(d=>`<div class="res-cell">${card(d,{cls:'win',float:true})}<button class="btn ghost sm" type="button" data-sell="${d.id}">Продать за ${fmt0(d.p)}</button></div>`).join('')}</div>`;

async function doUpgrade(){

  {const wh=$('#wheel'),rc=wh.getBoundingClientRect();if(rc.top<70||rc.bottom>innerHeight-80)scrollTo({top:scrollY+rc.top-90,behavior:'smooth'})}

  const set=new Set(ids);S.inv=S.inv.filter(i=>!set.has(i.id));S.bal=r2(S.bal-bal);updBal();
  const ch=+r.ch,rr=+r.r,arc=ch*360,start=180-arc/2;
  /* кольцо крутится, стрелка стоит сверху: подводим нужную точку кольца под стрелку */
  const theta=r.win?start+arc*(.06+.88*(rr/ch)):(start+arc+(360-arc)*(.03+.94*((rr-ch)/(1-ch))))%360;
  const arrow=ST3.up==='arrow',spins=S.fast?3:6,R=arrow?360*spins+theta:360*spins+((360-theta)%360);
  const rot=arrow?$('#needle'):$('#ringRot'),wh=$('#wheel'),dur=S.fast?SPEED.upF:SPEED.upN;
  $('#ringRot').style.transform='rotate(0deg)';$('#needle').style.transform='rotate(0deg)';
  wh.classList.remove('won','lost');wh.classList.add('spinning');
  rot.style.transition='none';rot.style.transform='rotate(0deg)';void rot.offsetWidth;
  SFX.spinStart(dur/1000);

  let last=-1,lastA=0,lastT=performance.now();const t0=performance.now();
  await new Promise(res=>{const loop=()=>{const m=tf(rot);const a=(Math.atan2(m.b,m.a)*180/Math.PI+360)%360;const now=performance.now();const sp=Math.min(1.5,Math.abs(((a-lastA+540)%360)-180)/Math.max(1,now-lastT)*8);lastA=a;lastT=now;const i=Math.floor(a/12);if(i!==last){last=i;SFX.tick(sp)}if(now-t0<dur+20)requestAnimationFrame(loop);else res()};requestAnimationFrame(loop)});
  wh.classList.remove('spinning');wh.classList.add(r.win?'won':'lost');S.bal=+r.bal;updBal();
  if(r.win){const it=toItem(r.item);S.inv.unshift(it);gotItems([it]);if(!S.best||it.p>S.best.p)S.best={...it};SFX.upWin();setTimeout(()=>SFX.reveal(SK[it.n].rar),250);confetti();toast(`Апнул! ${ruName(SK[it.n])[1]} за ${fmt0(it.p)}`);pollFeed()}
  else{SFX.upLose();toast(pick(['Мимо. Скины ушли Габену на новую яхту','Не зашло. Бывает раз в жизни, каждый день','Почти! (нет)','Кольцо сегодня против тебя']))}
  U.sel.clear();U.bal=0;U.target=null;
  await sleep(1600);busy=false;renderUpgrade();
}

async function durakPlay(P,plan,instant){

    <div class="dk-hands" id="dkH"></div><div class="dk-table" id="dkT"></div></div>`;
  const sb_=$('#dkSkip');if(sb_)sb_.onclick=()=>{skip=true;sb_.remove()};
  const outs=new Set();
  const drawH=(a,d)=>{$('#dkH').innerHTML=P.map((p,i)=>`<div class="dk-p${i===a?' att':''}${i===d?' def':''}${outs.has(i)?' out':''}"><div class="dk-pn">${avaHTML(p.name,p.col,p.ava,'sm')}<b>${esc(p.name)}</b><small>${outs.has(i)?'вышел':hands[i].length+' карт'}${i===a?' · ходит':i===d?' · отбивается':''}</small></div><div class="dk-cards">${hands[i].slice(0,12).map(c=>cardFace(cardOf(c),true)).join('')}${hands[i].length>12?`<span class="dk-more">+${hands[i].length-12}</span>`:''}</div></div>`).join('')};
  const step=()=>skip?0:(S.fast?220:520)*(plan.log.length>25?.5:1);
  drawH(-1,-1);if(!skip)await sleep(500);
  for(const t of plan.log){
    if(skip)break;
    drawH(t.a,t.d);const T=$('#dkT');T.innerHTML='';$('#dkSt').textContent=`${P[t.a].name} → ${P[t.d].name}`;
    for(const [x,y] of t.t){
      hands[t.a]=hands[t.a].filter(c=>c!==x);T.insertAdjacentHTML('beforeend',`<div class="dk-pair">${cardFace(cardOf(x),true)}</div>`);SFX.click();drawH(t.a,t.d);await sleep(step());if(skip)break;
      if(y!=null){hands[t.d]=hands[t.d].filter(c=>c!==y);T.lastElementChild.insertAdjacentHTML('beforeend',`<div class="dk-def">${cardFace(cardOf(y),true)}</div>`);SFX.tick(.8);drawH(t.a,t.d);await sleep(step());if(skip)break}
    }
    if(skip)break;
    if(t.k){t.t.forEach(([x,y])=>{hands[t.d].push(x);if(y!=null)hands[t.d].push(y)});T.insertAdjacentHTML('beforeend',`<div class="dk-msg neg">${esc(P[t.d].name)} взял</div>`);SFX.error()}
    else{T.insertAdjacentHTML('beforeend',`<div class="dk-msg pos">Бито</div>`);SFX.whoosh()}
    [t.a,t.d].forEach(i=>{if(!hands[i].length)outs.add(i)});drawH(t.a,t.d);await sleep(step()*1.4);
  }
  /* финал: восстанавливаем итог по серверу */
  if(skip){plan.log.forEach(t=>{t.t.forEach(([x,y])=>{[x,y].forEach(c=>{if(c!=null)hands.forEach((h,i)=>{hands[i]=h.filter(z=>z!==c)})})});if(t.k)t.t.forEach(([x,y])=>{hands[t.d].push(x);if(y!=null)hands[t.d].push(y)})});plan.out.forEach(i=>{if(i!==plan.durak)outs.add(i)})}
  drawH(-1,-1);$('#dkT').innerHTML=`<div class="dk-msg">${plan.durak!=null&&P[plan.durak]?`Дурак: <b>${esc(P[plan.durak].name)}</b>. `:''}Первым вышел <b>${esc(P[plan.winner].name)}</b></div>`;$('#dkSt').textContent='';$('#dkSkip')?.remove();
}

const WT={uid:null,nick:'',last:0,view:null,t:null,acts:[]};
function viewToRoute(v){v=String(v||'');if(v.startsWith('case:'))return 'case-'+v.slice(5);return v||null}
function startWatch(uid,nick){
  stopWatch(true);WT.uid=uid;WT.nick=nick;WT.last=0;WT.view=null;WT.acts=[];WT.key=null;
  document.body.insertAdjacentHTML('beforeend',`<div id="watchBar" class="watch-bar"><span class="wb-dot"></span><div class="wb-t"><b>Демонстрация экрана: ${esc(nick)}</b><small id="wbNow">подключаемся…</small></div><div class="wb-acts" id="wbActs"></div><button class="btn red sm" type="button" id="wbStop">Стоп</button></div>`);
  $('#wbStop').onclick=()=>stopWatch();
  const tick=async()=>{if(!WT.uid)return;try{const r=await rpc('zb_admin_watch',{p_user:WT.uid,p_on:true,p_after:WT.last});if(!WT.uid)return;
    for(const a of r.act||[]){WT.last=Math.max(WT.last,+a.id);if(a.k!=='view')WT.acts.unshift(a)}WT.acts.length=Math.min(WT.acts.length,3);
    const online=r.last_seen&&Date.now()+clockSkew-r.last_seen<70000;
    $('#wbNow').textContent=(online?'сейчас: ':'не в сети, был: ')+viewName(r.view)+' · баланс '+fmt0(+r.bal);
    $('#wbActs').innerHTML=WT.acts.map(actLine).join('');
    if(r.wkey&&!WT.key){WT.key=r.wkey;mirrorView(r.wkey,WT.nick)}
  }catch(e){toast(errMsg(e));stopWatch()}};
  tick();WT.t=setInterval(tick,2000);toast('Экран игрока появится справа, как только он что-то откроет. Он видит значок 👁');
}

/* ================= ЧАТЫ И ГРУППЫ ================= */
const CH={list:null,open:null,msgs:[],last:0,chat:null,timer:null,listTimer:null,att:null,sending:false};
const timeTxt=t=>{const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})};
const chatTitle=c=>c.kind==='dm'?(c.other?.nick||'Друг'):(c.title||'Группа');
const chatAva=c=>c.kind==='dm'?avaHTML(c.other?.nick,c.other?.col,c.other?.ava):`<span class="ava grp">${IC3.friends}</span>`;
function lastTxt(c){const l=c.last;if(!l)return 'Нет сообщений';if(l.kind==='sys')return l.text;const who=l.mine?'Ты: ':c.kind==='group'&&l.nick?esc(l.nick)+': ':'';return who+(l.text?esc(l.text):l.ftype==='audio'?'Голосовое':'Фото')}
async function loadChats(){try{CH.list=await rpc('zb_chats')}catch(e){CH.list=CH.list||[]}return CH.list}
function renderChats(){
  const v=$('#v-chats');
  v.innerHTML=`<div class="chat-wrap${CH.open?' has-open':''}"><aside class="chat-list panel"><div class="sec-h"><h2>Чаты</h2><button class="btn acc sm" type="button" id="newGrp">${IC3.plus} Группа</button></div><div id="chL"></div></aside><section class="chat-main panel" id="chM"></section></div>`;
  $('#newGrp').onclick=()=>{SFX.click();groupModal()};
  drawChatList();drawChat();
  loadChats().then(()=>{if(cur==='chats')drawChatList()});
  clearInterval(CH.listTimer);CH.listTimer=setInterval(()=>{if(cur!=='chats'){clearInterval(CH.listTimer);return}if(!document.hidden)loadChats().then(()=>{if(cur==='chats')drawChatList()})},8000);
}
function drawChatList(){
  const el=$('#chL');if(!el)return;const l=CH.list;
  if(!l){el.innerHTML='<div class="spin"></div>';return}
  el.innerHTML=l.length?l.map(c=>`<button type="button" class="chi${CH.open===c.id?' on':''}" data-chat="${c.id}">${chatAva(c)}<span class="chi-t"><b>${esc(chatTitle(c))}${c.kind==='group'?` <small class="mute">· ${c.members}</small>`:''}</b><small>${lastTxt(c)}</small></span><span class="chi-r"><small>${c.last_at?timeTxt(+c.last_at):''}</small>${+c.unread?`<i class="nb">${c.unread}</i>`:''}</span></button>`).join(''):`<div class="empty">Пока нет чатов. Напиши другу из вкладки «Друзья» или создай группу.</div>`;
  el.onclick=e=>{const b=e.target.closest('[data-chat]');if(b){SFX.click();openChat(+b.dataset.chat)}};
}
async function openDM(uid){try{const id=await rpc('zb_chat_dm',{p_uid:uid});go('chats');openChat(+id)}catch(e){toast(errMsg(e))}}
function openChat(id){CH.open=id;CH.msgs=[];CH.last=0;CH.chat=null;$('.chat-wrap')?.classList.add('has-open');drawChatList();drawChat();pollChat(true);clearInterval(CH.timer);CH.timer=setInterval(()=>{if(cur!=='chats'||!CH.open){clearInterval(CH.timer);return}if(!document.hidden)pollChat()},2500)}
async function pollChat(first){
  const id=CH.open;if(!id)return;
  try{const r=await rpc('zb_chat_msgs',{p_chat:id,p_after:CH.last});if(CH.open!==id)return;CH.chat=r.chat;
    const fresh=(r.msgs||[]).filter(m=>+m.id>CH.last);
    if(fresh.length){CH.msgs.push(...fresh);CH.last=Math.max(CH.last,...fresh.map(m=>+m.id));if(!first&&fresh.some(m=>!m.mine))SFX.msg();appendMsgs(fresh,first)}
    if(first)drawChatHead();
    const c=(CH.list||[]).find(x=>x.id===id);if(c&&+c.unread){c.unread=0;drawChatList();pollBadges()}
  }catch(e){if(first)toast(errMsg(e))}
}
function msgHTML(m,prev){
  if(m.kind==='sys')return `<div class="msg sys">${esc(m.text||'')}</div>`;
  const grp=CH.chat&&CH.chat.kind==='group',showName=grp&&!m.mine&&(!prev||prev.uid!==m.uid||prev.kind==='sys');
  return `<div class="msg${m.mine?' mine':''}">${!m.mine&&grp?(showName?avaHTML(m.nick,m.col,m.ava,'sm'):'<span class="ava-sp"></span>'):''}<div class="bub">${showName?`<b class="nm" style="color:${hexOk(m.col)?m.col:'var(--acc-2)'}">${esc(m.nick||'')}</b>`:''}${m.text?`<p>${esc(m.text)}</p>`:''}${mediaHTML(m.files)}<small>${timeTxt(+m.t)}</small></div></div>`;
}
function drawChatHead(){
  const h=$('#chHead');if(!h||!CH.chat)return;const c=CH.chat,l=(CH.list||[]).find(x=>x.id===c.id);
  const other=c.kind==='dm'?(c.members||[]).find(x=>x.uid!==S.uid):null;
  h.innerHTML=`<button class="icbtn ch-back" type="button" id="chBack" aria-label="Назад">${IC3.back}</button>${c.kind==='dm'?avaHTML(other?.nick,other?.col,other?.ava):`<span class="ava grp">${IC3.friends}</span>`}<button type="button" class="ch-t" ${other?`data-go="u-${other.pub}"`:'id="chInfo"'}><b>${esc(c.kind==='dm'?(other?.nick||'Друг'):c.title)}</b><small>${c.kind==='dm'?(other?.online?'в сети':'не в сети'):(c.members||[]).length+' участн.'}</small></button><button class="icbtn vc-btn${VC.chat===c.id?' on':''}" type="button" id="chVoice" aria-label="Голосовой чат" title="Голосовой чат">🎙</button>${c.kind==='group'?`<button class="icbtn" type="button" id="chMenu" aria-label="Группа">${IC3.dots}</button>`:''}`;
  $('#chVoice').onclick=()=>{if(VC.chat===c.id)voiceLeave();else voiceJoin(c.id,c.kind==='dm'?(other?.nick||'Друг'):c.title)};
  $('#chBack').onclick=()=>{CH.open=null;clearInterval(CH.timer);$('.chat-wrap')?.classList.remove('has-open');drawChatList();drawChat()};
  const m=$('#chMenu')||$('#chInfo');if(m)m.onclick=()=>groupInfo();
}
function drawChat(){
  const el=$('#chM');if(!el)return;
  if(!CH.open){el.innerHTML=`<div class="chat-empty">${IC3.chats}<b>Выбери чат слева</b><span class="mute">или напиши другу из вкладки «Друзья»</span></div>`;return}
  el.innerHTML=`<div class="ch-head" id="chHead"><div class="spin sm"></div></div><div class="ch-msgs" id="chMsgs"></div>
  <div class="composer" id="chComp"><div class="att-list" hidden></div><div class="comp-row">${attachHTML()}<textarea class="inp" id="chTxt" rows="1" maxlength="1000" placeholder="Сообщение…"></textarea><button class="btn acc send" type="button" id="chSend" aria-label="Отправить">${SEND}</button></div></div>`;
  CH.att=attachUI($('#chComp'));
  const ta=$('#chTxt');ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(120,ta.scrollHeight)+'px'};
  ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(min-width:700px)').matches){e.preventDefault();sendMsg()}};
  $('#chSend').onclick=sendMsg;
}
function appendMsgs(list,first){
  const box=$('#chMsgs');if(!box)return;const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  const all=CH.msgs;const start=all.length-list.length;
  box.insertAdjacentHTML('beforeend',list.map((m,i)=>msgHTML(m,all[start+i-1])).join(''));
  hydrateMedia(box);if(first||near)box.scrollTop=box.scrollHeight;
}
async function sendMsg(){
  if(CH.sending||!CH.open)return;const ta=$('#chTxt'),txt=ta.value.trim();if(!txt&&!CH.att.count)return;
  CH.sending=true;$('#chSend').disabled=true;
  try{const files=CH.att.count?await CH.att.upload():[];await rpc('zb_chat_send',{p_chat:CH.open,p_text:txt,p_files:files});ta.value='';ta.style.height='auto';CH.att.clear();SFX.soft();await pollChat()}
  catch(e){toast(errMsg(e));SFX.error()}
  CH.sending=false;const b=$('#chSend');if(b)b.disabled=false;
}
function friendPicker(sel,exclude=[]){

  return fr.length?`<div class="pick-fr">${fr.map(x=>`<button type="button" data-pick="${x.uid}" aria-pressed="${sel.has(x.uid)}">${avaHTML(x.nick,x.col,x.ava,'sm')}<span>${esc(x.nick)}</span></button>`).join('')}</div>`:'<div class="mute">Сначала добавь друзей во вкладке «Друзья»</div>';

  ['Как работает «Дурак»?','Каждый дроп в битве становится картой. Масть от оружия, старше та, что дороже, козырь случайный. Ты ходишь сам: атакуешь, отбиваешься, подкидываешь карты того же ранга или берёшь. На ход 45 секунд, иначе сходит автоматически. Кто первым скинул карты, забирает весь банк.'],

  ['Админ видит, что я делаю?','Админ видит ник, почту, устройство, раздел сайта и действия на сайте (дропы, продажи, пополнения). Если админ включил демонстрацию экрана, он видит то же, что и ты на сайте (кейсы, апгрейды, битвы), а у тебя в углу горит значок 👁.'],

  ['Почему мне то везёт, то нет?','Удача идёт полосами, как на настоящих кейс-сайтах: то густо, то пусто. Шансы на странице кейса показаны для обычной полосы. Всё считает сервер, подкрутить с телефона нельзя.'],
  ['Как работает апгрейд?','Ставишь до 6 скинов и (или) часть баланса, выбираешь скин дороже. Чем больше множитель, тем уже зелёная полоса на кольце. Максимальный шанс 75%.'],

  ['Как работает карточный режим?','Ранг карты зависит от цены скина: до 5 ₽ двойка, от 8 000 ₽ туз. Масть от оружия: ♠ винтовки, ♥ пистолеты, ♣ ПП и дробовики, ♦ ножи, перчатки и агенты. Комбинации от слабой к сильной: старшая карта, пара, две пары, сет, стрит (3 ранга подряд), флеш (минимум 3 карты одной масти), фулл-хаус, каре.'],
  ['Как добавить друга?','Во вкладке «Друзья» есть твой ID из 6 цифр. Кинь его другу или нажми «Ссылка-приглашение». Друзья видят только ник, аватар и ID, почту никто не видит.'],

async function marketRebalance(btn,log){
  const say=t=>{log.textContent=t};
  btn.disabled=true;
  try{
    say('Сервер скачивает прайс CS Market…');await rpc('zb_admin_market',{p_act:'fetch'});

    if(!r||r.pending)throw new Error('CS Market не ответил за 2 минуты, попробуй позже');
    say(`CS Market: ${r.real||0} реальных цен, ${r.est||0} оценено по соседним износам. Кейсы пересчитаны: ${r.cases||0}, инвентари: ${r.inv||0}.`);
    await loadPrices();try{await refreshState()}catch(e){}SFX.cash();
    CASES.forEach(c=>delete c.tease);

  btn.disabled=false;
}

function authScreen(state,msg){
  const g=$('#gate');g.hidden=false;
  const body=$('#gBody');
  if(state==='nocfg'){body.innerHTML=`<h2>Сайт ещё не настроен</h2><p>Не найден файл config.js с адресом сервера Supabase. Владельцу нужно добавить его по инструкции.</p>`;return}
  if(state==='wait'){body.innerHTML=`<div class="spin"></div><h2>Загружаем…</h2>`;return}
  if(state==='email'){
    body.innerHTML=`${INVITE?`<div class="invite"><b>Секретный инвайт</b><span>Тебя позвал <b>${esc(INVITE)}</b>. После входа забирай промокод <b>ГАБЕН</b> на +1000 ₽</span></div>`:''}<h2>Вход и регистрация</h2><p>Введи почту, пришлём код. Аккаунт создастся сам.</p><div class="field" style="width:100%"><input id="aEmail" class="inp" type="email" inputmode="email" autocomplete="email" placeholder="почта@mail.ru" value="${esc(AUTH.email||'')}"></div><button class="btn acc" type="button" id="aSend" style="width:100%">Получить код</button>${msg?`<p class="neg" style="font-size:14px">${esc(msg)}</p>`:''}<p style="font-size:12px">Владелец сайта видит твою почту, ник, устройство, раздел, где ты сейчас, и действия на сайте. Деньги на сайте ненастоящие.</p>`;
    const send=async()=>{const em=$('#aEmail').value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){toast('Проверь почту');return}const b=$('#aSend');b.disabled=true;b.textContent='Отправляем…';
      const {error}=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:true}});
      if(error){b.disabled=false;b.textContent='Получить код';toast(/rate|seconds/i.test(error.message)?'Слишком часто. Подожди минуту и попробуй снова':error.message);return}
      AUTH.email=em;AUTH.sentAt=Date.now();authScreen('code')};
    $('#aSend').onclick=send;$('#aEmail').onkeydown=e=>{if(e.key==='Enter')send()};setTimeout(()=>$('#aEmail')?.focus(),100);return;
  }
  if(state==='code'){
    body.innerHTML=`<h2>Введи код из письма</h2><p>Отправили на <b style="color:var(--fg)">${esc(AUTH.email)}</b>. Если письма нет, проверь «Спам».</p><div class="field" style="width:100%"><input id="aCode" class="inp" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456" style="text-align:center;font-family:var(--f-mono);font-size:24px;letter-spacing:.3em;height:58px"></div><button class="btn acc" type="button" id="aVerify" style="width:100%">Войти</button><div class="row" style="width:100%"><button class="btn ghost sm" type="button" id="aBack">Другая почта</button><button class="btn ghost sm" type="button" id="aResend">Отправить ещё раз</button></div>`;
    const verify=async()=>{const code=$('#aCode').value.replace(/\D/g,'');if(code.length<6){toast('Код из 6–8 цифр');return}const b=$('#aVerify');b.disabled=true;b.textContent='Проверяем…';
      const {error}=await sb.auth.verifyOtp({email:AUTH.email,token:code,type:'email'});
      if(error){b.disabled=false;b.textContent='Войти';toast(/expired|invalid/i.test(error.message)?'Код неверный или устарел':error.message);return}
      await enter()};
    $('#aVerify').onclick=verify;$('#aCode').onkeydown=e=>{if(e.key==='Enter')verify()};
    $('#aBack').onclick=()=>authScreen('email');
    $('#aResend').onclick=async e=>{if(Date.now()-AUTH.sentAt<60000){toast('Повторно можно через минуту');return}e.currentTarget.disabled=true;const {error}=await sb.auth.signInWithOtp({email:AUTH.email,options:{shouldCreateUser:true}});e.currentTarget.disabled=false;if(error)toast(error.message);else{AUTH.sentAt=Date.now();toast('Отправили новый код')}};
    setTimeout(()=>$('#aCode')?.focus(),100);return;
  }
}

/* ================= «ДУРАК»: игроки ходят сами ================= */
const DKL={t:null,busy:false,seen:0};
function dkCardsOf(plan){const m=plan.drops[0].length;return id=>plan.drops[Math.floor(id/m)][id%m]}
function dkPlayable(st,seat){
  if(st.done)return new Set();const ph=st.phase,act=ph==='defend'?st.def:st.att;if(act!==seat)return new Set();
  const hand=st.hands[seat]||[],C=st.cards,tr=st.trump,ok=new Set();
  const beats=(d,a)=>(C[d][1]===C[a][1]&&(C[d][0]>C[a][0]||(C[d][0]===C[a][0]&&C[d][2]>C[a][2])))||(C[d][1]===tr&&C[a][1]!==tr);
  if(ph==='attack')hand.forEach(c=>ok.add(c));
  else if(ph==='defend'){const a=st.table[st.table.length-1][0];hand.forEach(c=>{if(beats(c,a))ok.add(c)})}
  else if(ph==='throw'){const rk=new Set();st.table.forEach(pr=>pr.forEach(c=>{if(c!=null)rk.add(C[c][0])}));if(st.table.length<6&&(st.hands[st.def]||[]).length)hand.forEach(c=>{if(rk.has(C[c][0]))ok.add(c)})}
  return ok;
}
const DK_ACT={attack:'ходит',defend:'отбивается',take:'взял',throw:'подкидывает',bito:'— бито'};
function dkDraw(box,v,P,plan){
  const st=v.st,me=v.seat,cardOf=dkCardsOf(plan),red=st.trump==='h'||st.trump==='d',play=dkPlayable(st,me);
  const actor=st.phase==='defend'?st.def:st.att,myTurn=!st.done&&actor===me;
  const left=Math.max(0,Math.round(((+st.dl||0)-(+v.now||Date.now()))/1000));
  const hint=st.done?'':myTurn?(st.phase==='attack'?'Твой ход: кидай любую карту':st.phase==='defend'?'Отбивайся: старше той же масти или козырь. Или бери':'Можешь подкинуть карту того же ранга или сказать «бито»'):`Ходит ${esc(P[actor]?.name||'…')}`;
  const opp=P.map((p,i)=>i).filter(i=>i!==me);
  const lastLog=(st.log||[]).slice(0,4).map(e=>`<span>${esc(P[e.seat]?.name||'?')} ${DK_ACT[e.act]||e.act}${e.c!=null?' '+esc(ruName(SK[cardOf(e.c).n])[1]):''}${e.auto?' (авто)':''}</span>`).join('');
  box.innerHTML=`<div class="dk live"><div class="dk-h"><b>Дурак</b><span class="dk-tr${red?' red':''}">Козырь ${SUITS[st.trump]||'?'}</span>${st.done?'':`<span class="dk-timer${myTurn?' my':''}">${myTurn?'Твой ход':'Ждём'} · ${left} с</span>`}</div>
    <div class="dk-opps">${opp.map(i=>`<div class="dk-opp${i===actor&&!st.done?' act':''}${(st.out||[]).includes(i)?' out':''}">${avaHTML(P[i].name,P[i].col,P[i].ava,'sm')}<b>${esc(P[i].name)}</b><span class="dk-backs">${Array.from({length:Math.min(8,(st.hands[i]||[]).length)},()=>'<i></i>').join('')}</span><small>${(st.out||[]).includes(i)?'вышел':(st.hands[i]||[]).length+' карт'}${i===st.att&&!st.done?' · атакует':i===st.def&&!st.done?' · защита':''}</small></div>`).join('')}</div>
    <div class="dk-table">${st.table.length?st.table.map(([a,d])=>`<div class="dk-pair">${cardFace(cardOf(a),true)}${d!=null?`<div class="dk-def">${cardFace(cardOf(d),true)}</div>`:''}</div>`).join(''):`<div class="dk-msg mute">${st.done?'':'Стол пуст'}</div>`}</div>
    <div class="dk-log">${lastLog}</div>
    ${me>=0?`<div class="dk-hint${myTurn?' my':''}">${hint}</div>
    <div class="dk-hand">${(st.hands[me]||[]).slice().sort((x,y)=>(st.cards[x][1]===st.trump)-(st.cards[y][1]===st.trump)||st.cards[x][0]-st.cards[y][0]).map(c=>`<button type="button" class="dk-c${play.has(c)?' ok':''}" data-c="${c}" ${play.has(c)?'':'disabled'}>${cardFace(cardOf(c),true)}</button>`).join('')||'<span class="mute">Карт нет — ты вышел!</span>'}</div>
    <div class="row dk-btns">${myTurn&&st.phase==='defend'?'<button class="btn red" type="button" data-dk="take">Взять</button>':''}${myTurn&&st.phase==='throw'?'<button class="btn acc" type="button" data-dk="bito">Бито</button>':''}</div>`:''}
  </div>`;
}
function durakLive(bid,P,plan,meIdx){
  return new Promise(res=>{
    const box=$('#jpBox');let v=null,stop=false,lastSeq=-1;
    const done=()=>{stop=true;clearInterval(DKL.t);res(v)};
    const pull=async()=>{if(stop||DKL.busy)return;try{const r=await rpc('zb_dk',{p_battle:bid});if(stop)return;v=r;if(!box.isConnected){done();return}
      if(r.st.seq!==lastSeq){lastSeq=r.st.seq;const e=(r.st.log||[])[0];if(e){e.act==='take'?SFX.error():e.act==='bito'?SFX.whoosh():SFX.click()}}
      dkDraw(box,r,P,plan);if(r.st.done){setTimeout(done,900)}}catch(e){}};
    box.onclick=async e=>{
      const b=e.target.closest('[data-c]'),k=e.target.closest('[data-dk]');if(!b&&!k)return;if(!v||DKL.busy)return;
      const st=v.st,ph=st.phase,act=k?k.dataset.dk:ph==='attack'?'attack':ph==='defend'?'defend':'throw';
      DKL.busy=true;try{const r=await rpc('zb_dk_move',{p_battle:bid,p_act:act,p_card:b?+b.dataset.c:null});v=r;lastSeq=r.st.seq;SFX.click();dkDraw(box,r,P,plan);if(r.st.done)setTimeout(done,900)}catch(err){toast(errMsg(err));SFX.error()}DKL.busy=false;
    };
    clearInterval(DKL.t);DKL.t=setInterval(pull,1200);pull();
    box.scrollIntoView({behavior:'smooth',block:'start'});
  });
}

    <div class="fl-ui" id="flUi"><b>ФЛАППИ ЗАНОС</b><span>Тапни или нажми пробел, чтобы взлететь</span><button class="btn acc lg" type="button" id="flGo">Играть</button><small id="flLeft"></small></div>
    <div class="fl-score" id="flScore" hidden>0</div></div>
  <aside class="fl-side"><div class="panel"><h3 class="ph3">Призы</h3><div class="fl-prizes">${[[5,38],[10,150],[20,600],[30,1350],[50,3750],[70,7350],[82,'10 000']].map(([s,p])=>`<div><span>${s} труб</span><b>${typeof p==='number'?fmt0(p):p+' ₽'}</b></div>`).join('')}</div><small class="mute">До 8 попыток в час, за сутки можно выиграть до 30 000 ₽</small></div>
  <div class="panel"><h3 class="ph3">Топ недели</h3><div id="flTop" class="ev-top"><div class="spin sm"></div></div></div></aside></div>`;
  const drawTop=t=>{FL.top=t;const el=$('#flTop');if(!el)return;el.innerHTML=(t.top||[]).map((x,i)=>`<div class="ev-top-r"><span class="ev-pl">${i+1}</span>${avaHTML(x.nick,x.col,x.ava,'sm')}<b>${esc(x.nick)}</b><span class="mono">${x.score}</span></div>`).join('')||'<div class="mute">Пока никого. Будь первым</div>';
    const l=$('#flLeft');if(l)l.textContent=`Попыток в этот час: ${t.left??'?'} · рекорд: ${t.best??0}`};
  rpc('zb_fl_top').then(drawTop).catch(()=>{});
  flappyBind(drawTop);
}
VIEWS.games=renderGames;
function flappyBind(drawTop){
  const cv=$('#flC'),cx=cv.getContext('2d'),W=400,H=600;
  const G={run:false,id:null,y:H/2,vy:0,pipes:[],score:0,t:0,last:0,dead:false,spd:2.6,gap:170,next:0};
  const bird=new Image();
  const reset=()=>{Object.assign(G,{y:H/2,vy:0,pipes:[],score:0,t:0,dead:false,spd:2.6,gap:170,next:90})};
  const flap=()=>{if(!G.run||G.dead)return;G.vy=-7.4;SFX.click()};
  const draw=()=>{
    const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a0c3a');g.addColorStop(1,'#07051a');cx.fillStyle=g;cx.fillRect(0,0,W,H);
    cx.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<30;i++){cx.fillRect((i*137+G.t*.3)%W,(i*71)%H,2,2)}
    for(const p of G.pipes){const grd=cx.createLinearGradient(p.x,0,p.x+60,0);grd.addColorStop(0,'#7a3cff');grd.addColorStop(1,'#a94dff');cx.fillStyle=grd;
      cx.fillRect(p.x,0,60,p.top);cx.fillRect(p.x,p.top+G.gap,60,H-p.top-G.gap);cx.fillStyle='#ffd23a';cx.fillRect(p.x-4,p.top-14,68,14);cx.fillRect(p.x-4,p.top+G.gap,68,14)}
    cx.save();cx.translate(90,G.y);cx.rotate(Math.max(-.5,Math.min(1.2,G.vy*.08)));
    cx.shadowColor='#ffd23a';cx.shadowBlur=14;
    const bl=cx.createLinearGradient(-6,-8,26,8);bl.addColorStop(0,'#f4f6ff');bl.addColorStop(1,'#9aa3c8');
    cx.fillStyle=bl;cx.beginPath();cx.moveTo(-4,-6);cx.quadraticCurveTo(20,-12,30,2);cx.quadraticCurveTo(14,4,-4,6);cx.closePath();cx.fill();
    cx.shadowBlur=0;cx.fillStyle='#2a1a10';cx.fillRect(-22,-5,18,10);cx.fillStyle='#ffd23a';cx.fillRect(-6,-8,4,16);
    cx.fillStyle='#ff5fd0';cx.beginPath();cx.arc(-24,0,5,0,6.3);cx.fill();cx.restore();
    cx.fillStyle='rgba(255,210,58,.14)';cx.fillRect(0,H-40,W,40);
  };
  const end=async()=>{G.dead=true;G.run=false;SFX.lose();
    const sc=G.score;$('#flUi').hidden=false;$('#flUi').innerHTML=`<b>${sc} ${sc%10===1&&sc%100!==11?'труба':sc%10>=2&&sc%10<=4&&(sc%100<10||sc%100>=20)?'трубы':'труб'}</b><span>Считаем приз…</span>`;
    try{const r=await rpc('zb_fl_end',{p_id:G.id,p_score:sc});applyState(r.state);updBal();
      $('#flUi').innerHTML=`<b>${r.score} труб</b><span>${+r.prize>0?`Приз: <b class="pos">+${fmt0(+r.prize)}</b>`:'Без приза: нужно хотя бы 3 трубы'}</span><button class="btn acc lg" type="button" id="flGo">Ещё раз</button><small id="flLeft"></small>`;
      if(+r.prize>0){SFX.cash();if(+r.prize>=1000)confetti()}
      $('#flGo').onclick=start;drawTop({...(FL.top||{}),top:r.top,best:r.best,left:Math.max(0,(FL.top?.left||1)-1)})}
    catch(e){$('#flUi').innerHTML=`<b>Ошибка</b><span>${esc(errMsg(e))}</span><button class="btn acc lg" type="button" id="flGo">Ещё раз</button>`;$('#flGo').onclick=start}};
  const step=ts=>{if(!G.run)return;if(!cv.isConnected){G.run=false;return}
    const dt=Math.min(2,(ts-(G.last||ts))/16.67);G.last=ts;G.t+=dt;
    G.vy+=.42*dt;G.y+=G.vy*dt;
    G.next-=G.spd*dt;if(G.next<=0){G.pipes.push({x:W,top:60+Math.random()*(H-G.gap-160),done:false});G.next=G.spd*75}
    for(const p of G.pipes){p.x-=G.spd*dt;if(!p.done&&p.x+60<90){p.done=true;G.score++;$('#flScore').textContent=G.score;SFX.coin();G.spd=Math.min(5.2,2.6+G.score*.045);G.gap=Math.max(128,170-G.score*.7)}}
    G.pipes=G.pipes.filter(p=>p.x>-80);
    const hit=G.y>H-52||G.y<10||G.pipes.some(p=>90+14>p.x&&90-14<p.x+60&&(G.y-14<p.top||G.y+14>p.top+G.gap));
    draw();if(hit){end();return}requestAnimationFrame(step)};
  const start=async()=>{
    try{const r=await rpc('zb_fl_start');G.id=r.id}catch(e){toast(errMsg(e));return}
    reset();$('#flUi').hidden=true;$('#flScore').hidden=false;$('#flScore').textContent='0';G.run=true;G.last=0;G.vy=-6;requestAnimationFrame(step)};
  $('#flGo').onclick=start;
  $('#flStage').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;flap()});
  const kd=e=>{if(cur!=='games'){removeEventListener('keydown',kd);return}if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}};addEventListener('keydown',kd);
  reset();draw();
}

/* ================= ДЕМОНСТРАЦИЯ ЭКРАНА ================= */
const MIR_SEL='.track,#ringRot,#needle,#jpPtr,.bigwheel,.slide.on';
const MS={ch:null,key:null,t1:null,t2:null,lastHtml:'',lastTf:''};
function mirrorSend(key){
  if(!sb||!sb.channel)return;
  if(MS.key===key&&MS.ch)return;mirrorStop();
  MS.key=key;MS.ch=sb.channel('zbw-'+key,{config:{broadcast:{self:false}}});MS.ch.subscribe();
  const snap=()=>{
    const sec=$('main>section:not([hidden])');if(!sec)return;
    const md=$('#modal'),mHtml=md&&!md.hidden?md.outerHTML:'';
    const html=sec.outerHTML+mHtml;
    const hk=html.replace(/ style="[^"]*"/g,'');if(hk===MS.lastKey&&!MS.force)return;MS.force=false;MS.lastKey=hk;
    if(html.length>230000){MS.ch.send({type:'broadcast',event:'s',payload:{big:true,view:cur==='case'?'case:'+((location.hash||'').slice(6)):cur,w:innerWidth,h:innerHeight}});MS.lastHtml=html;return}
    const hd=$('header.hdr'),nb=$('#navBot');MS.lastHtml=html;MS.ch.send({type:'broadcast',event:'s',payload:{st:sec.getBoundingClientRect().top+scrollY,mc:(sec.parentElement&&sec.parentElement.className)||'',bc:document.body.className,hdr:hd?hd.outerHTML:'',nav:nb&&getComputedStyle(nb).display!=='none'?nb.outerHTML:'',html,view:cur==='case'?'case:'+((location.hash||'').slice(6)):cur,w:innerWidth,h:innerHeight,sy:scrollY,th:S.theme||ST3.theme,bal:S.bal}});
  };
  const tfs=()=>{
    const sec=$('main>section:not([hidden])');if(!sec)return;
    const list=[...document.querySelectorAll('main>section:not([hidden]) '+MIR_SEL.split(',').join(',main>section:not([hidden]) ')+',#modal:not([hidden]) .track')].map(el=>getComputedStyle(el).transform);
    const key=list.join('|')+'@'+Math.round(scrollY);
    if(key===MS.lastTf)return;MS.lastTf=key;
    MS.ch.send({type:'broadcast',event:'t',payload:{l:list,sy:scrollY,st:sec.getBoundingClientRect().top+scrollY}});
  };
  MS.t1=setInterval(snap,450);MS.t2=setInterval(tfs,90);
  MS.ch.on('broadcast',{event:'hello'},()=>{MS.force=true});
}
function mirrorStop(){clearInterval(MS.t1);clearInterval(MS.t2);try{MS.ch&&sb.removeChannel(MS.ch)}catch(e){}MS.ch=null;MS.key=null;MS.lastHtml='';MS.lastKey='';MS.lastTf=''}

const MV={ch:null,doc:null,w:390,h:800};
function mirrorView(key,nick){
  mirrorViewStop();
  document.body.insertAdjacentHTML('beforeend',`<div id="mirror" class="mirror"><div class="mir-h"><span class="wb-dot"></span><b>Экран: ${esc(nick)}</b><small id="mirNow">ждём картинку…</small><button class="icbtn" type="button" id="mirMin" aria-label="Свернуть">—</button></div><div class="mir-body" id="mirBody"><iframe id="mirF" title="Экран игрока" sandbox="allow-same-origin"></iframe></div><div class="wb-acts" id="wbActs"></div></div>`);
  $('#mirMin').onclick=()=>$('#mirror').classList.toggle('min');
  const f=$('#mirF'),css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  f.srcdoc=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${css}\nbody{overflow:hidden!important}#mroot{padding-bottom:150vh!important}.mir-wait{display:grid;place-items:center;height:100vh;color:#9799c9;font:600 16px system-ui}</style></head><body><div id="mhdr"></div><main id="mroot"><div class="mir-wait">Ждём, когда игрок что-нибудь откроет…</div></main><div id="mnav"></div></body></html>`;
  f.onload=()=>{MV.doc=f.contentDocument;fit()};
  const fit=()=>{const b=$('#mirBody');if(!b)return;const s=Math.min(b.clientWidth/MV.w,b.clientHeight/MV.h);f.style.width=MV.w+'px';f.style.height=MV.h+'px';f.style.transform=`scale(${s})`};
  addEventListener('resize',fit);
  if(!sb||!sb.channel){$('#mirNow').textContent='демонстрация недоступна в этом браузере';return}
  MV.ch=sb.channel('zbw-'+key,{config:{broadcast:{self:false}}});
  MV.ch.on('broadcast',{event:'s'},({payload:p})=>{
    const d=MV.doc;if(!d)return;
    if(p.w&&p.h&&(p.w!==MV.w||p.h!==MV.h)){MV.w=p.w;MV.h=p.h;fit()}
    if(p.big){$('#mirNow').textContent=viewName(p.view)+' · страница слишком большая для показа';return}
    const t=THEMES[p.th]||THEMES.violet;for(const [k,val] of Object.entries(t.v))d.documentElement.style.setProperty('--'+k,val);
    if(p.mc!=null)d.getElementById('mroot').className=p.mc;if(p.bc!=null)d.body.className=p.bc;
    d.getElementById('mroot').innerHTML=p.html.replace(/<script[\s\S]*?<\/script>/gi,'');
    if(p.hdr!=null)d.getElementById('mhdr').outerHTML='<div id="mhdr" style="display:contents">'+p.hdr+'</div>';
    if(p.nav!=null){const n=d.getElementById('mnav');if(n)n.innerHTML=p.nav}
    MV.st=p.st||0;mirScroll(d,p.sy);
    $('#mirNow').textContent=viewName(p.view)+(p.bal!=null?' · баланс '+fmt0(+p.bal):'')+' · LIVE';
  });
  MV.ch.on('broadcast',{event:'t'},({payload:p})=>{
    const d=MV.doc;if(!d)return;
    const els=[...d.querySelectorAll(MIR_SEL.split(',').map(x=>'#mroot>section '+x).join(',')+',#mroot #modal .track')];
    p.l.forEach((m,i)=>{const el=els[i];if(el){el.style.transition='none';el.style.transform=m}});
    if(p.st!=null)MV.st=p.st;if(p.sy!=null)mirScroll(d,p.sy);
  });
  MV.ch.subscribe(st=>{if(st==='SUBSCRIBED')MV.ch.send({type:'broadcast',event:'hello',payload:{}})});
  MV.hello=setInterval(()=>{try{MV.ch.send({type:'broadcast',event:'hello',payload:{}})}catch(e){}},15000);
}
/* в зеркале нет шапки сайта, поэтому прокрутку считаем от начала раздела */
function mirScroll(d,sy){const sec=d.querySelector('#mroot>section');const my=sec?sec.getBoundingClientRect().top+d.scrollingElement.scrollTop:0;d.scrollingElement.scrollTop=Math.max(0,(sy||0)-(MV.st||0)+my)}
function mirrorViewStop(){clearInterval(MV.hello);try{MV.ch&&sb.removeChannel(MV.ch)}catch(e){}MV.ch=null;MV.doc=null;$('#mirror')?.remove()}

userUI();
if(!sb)authScreen('nocfg');
else{
  authScreen('wait');
  sb.auth.getSession().then(({data})=>{if(data&&data.session)enter();else authScreen('email')}).catch(()=>authScreen('email'));
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){authed=false;authScreen('email')}});
}
